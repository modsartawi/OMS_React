.rb-th { padding: 5px 8px; display: flex; align-items: center; }
.rb-spacer { flex: 1; }
.rb-notes { display: flex; align-items: center; gap: 6px; font: 500 12.5px var(--rb-ui); padding: 6px 11px; border-radius: 8px; border: 1px solid var(--rb-line); background: var(--rb-chip); color: var(--rb-fg); cursor: pointer; }

.main { flex: 1; min-height: 0; display: flex; }
.stage { flex: 1; min-width: 0; overflow: auto; }
.app { min-width: 1240px; height: 100%; min-height: 680px; }

.notes { width: 360px; flex: none; overflow: auto; border-inline-start: 1px solid var(--rb-line); background: var(--rb-chip); padding-block: 16px; padding-inline: 18px; font-size: 13px; line-height: 1.5; }
.notes-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }

@media (max-width: 900px) {

  .rb-seg-l { display: none; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

      <span class="rchip"><i>PLANT</i>${esc(s.run.plant)}</span><span class="rchip"><i>ORG</i>${esc(s.run.org)}</span><span class="rchip"><i>CHAN</i>${esc(s.run.chan)}</span>

    const form = h`<div class="n-run-form">
      <label class="fld"><span>Plant</span><input id="near-s-plant" class="inp" value="P001"></label>
      <label class="fld"><span>Pricing date</span><input id="near-s-date" class="inp" type="date" value="2026-07-25"></label>
      <label class="fld"><span>Sales org</span><input id="near-s-org" class="inp" value="1000"></label>
      <label class="fld"><span>Distribution channel</span><input id="near-s-chan" class="inp" value="20"></label>
      <label class="fld"><span>Procedure key</span><input id="near-s-proc" class="inp" placeholder=""><span class="hint">'W' = Wasfaty</span></label>
      <label class="fld"><span>Loyalty group</span><input id="near-s-loy" class="inp"></label>
      <label class="fld"><span>Loyalty tier</span><select id="near-s-tier" class="inp"><option>(none)</option><option>Silver (S)</option><option>Gold (G)</option><option>Platinum (P)</option></select></label>
      <div></div>
      <div class="checks"><label class="chk"><input id="near-s-promo" type="checkbox" checked>Promotion</label><label class="chk"><input id="near-s-elem" type="checkbox">Pricing Elements</label></div>
    </div>`;
    const runCtl = h`<div class="n-run-ctl">
      <button type="button" class="btn btn-primary" data-act="process" ${ui.simBusy ? 'disabled' : ''}>${icon('play', 12)}${ui.simBusy ? 'Processing…' : 'Process'} <kbd style="background:transparent;color:inherit;border-color:currentColor;opacity:.75">⌃⏎</kbd></button>
      <button type="button" class="btn btn-outline">Clear</button>
      <button type="button" class="btn btn-outline">${icon('layers', 13)}Clear cache</button></div>`;

    const lines = s.lines.map((l) => {
      const open = !!ui.simOpen[l.pos];
      const np = l.total == null;
      const promo = l.promo === 'fired' ? '<span class="fired">' + icon('check', 12) + 'fired</span>' : l.promo === 'W' ? '<span class="bdg bdg-warn">W</span>' : '<span style="color:var(--ink-3)">—</span>';
      const row = h`<tr class="ln${open ? ' is-open' : ''}" data-line="${l.pos}" tabindex="0" aria-expanded="${open}">
        <td><span class="pos">${icon(open ? 'chevronDown' : 'chevronRight', 12)}${l.pos}</span></td>
        <td class="it${np ? ' np' : ''}"><b>${esc(l.desc)}</b><small>${esc(l.material)}</small>${np ? '<span class="msg">' + esc(l.message) + '</span>' : ''}</td>
        <td class="q num">${l.qty} ${esc(l.uom)}${l.unit != null ? '<small>× ' + money(l.unit) + '</small>' : ''}</td>
        <td>${promo}</td>
        <td class="end num was">${l.was != null ? money(l.was) : ''}</td>
        <td class="end num" style="color:var(--success-800)">${l.saved ? money(l.saved) : ''}</td>
        <td class="end num">${np ? '<span class="np-v">not priced</span>' : '<span class="tot">' + money(l.total) + '<small>SAR</small></span>'}</td>
      </tr>`;
      if (!open) return row;
      let exp;
      if (l.conditions) {
        exp = h`<div class="n-mfoot">Net <span class="num">118.64</span> + Tax <span class="num">17.80</span> = Net total <b class="num">${money(l.total)}</b> SAR</div>
          <h4>Applied pricing rules</h4>
          ${l.conditions.map((c) => h`<div class="cond"><span class="t">${c.n}. ${esc(c.kind)}: <span class="mono">${esc(c.code)}</span> — ${esc(c.name)}${c.kind === 'Promotion' ? '<span class="ch promo">PROMOTION</span>' : ''}${c.times ? '<span class="ch x">×' + c.times + '</span>' : ''}${c.stat ? '<span class="ch">STAT</span>' : ''}</span><span class="v${c.value < 0 ? ' neg' : ''}">${money(c.value)}</span><span class="s">Rate: ${esc(c.rate)} | Base: ${esc(c.base)}</span></div>`)}
          <h4>Pricing elements</h4>
          <table class="trace"><thead><tr><th>Step</th><th>Type</th><th>Description</th><th class="end">Base</th><th class="end">Rate</th><th class="end">Value</th><th>Bonus buy</th></tr></thead><tbody>
          ${l.elements.map((r) => '<tr' + (r[1] ? '' : ' class="sub"') + '><td>' + r[0] + '</td><td class="mono">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td><td class="end">' + esc(r[3]) + '</td><td class="end">' + esc(r[4]) + '</td><td class="end">' + esc(r[5]) + '</td><td>' + esc(r[6]) + '</td></tr>')}
          </tbody></table>`;
      } else if (np) {

      } else {
        exp = h`<div class="n-mfoot">Net <span class="num">9.13</span> + Tax <span class="num">1.37</span> = Net total <b class="num">${money(l.total)}</b> SAR</div><h4>Applied pricing rules</h4><div class="cond"><span class="t">1. Pricing: <span class="mono">VKP0</span> — Basic Price</span><span class="v">9.13</span><span class="s">Rate: 9.130 SAR | Base: 1.00</span></div>`;

      return row + '<tr class="n-exp"><td colspan="7">' + exp + '</td></tr>';
    }).join('');

    const f = s.fired;
    const miss = s.missed[0];
    const page = h`
      ${pageHeader(ctx, 'Pricing & Promotions', 'POS Simulation', h`<span>Price a basket the way the till would, and see which promotions fire.</span><span class="sep">|</span><span>Sample basket: Promotion applied</span>`, h`
        <select class="inp" style="width:190px;height:28px" aria-label="Sample basket"><option>Promotion applied</option><option>Could have applied</option><option>Multiple items</option><option>Pricing trace</option></select>
        <button type="button" class="btn btn-outline">${icon('refresh', 13)}Reset sample</button>`)}
      <section class="n-run" aria-label="Run settings">
        <div class="n-run-row">
          ${ui.simEdit
            ? h`<b style="font-size:13px">Run settings</b><button type="button" class="btn btn-text btn-sm" data-act="edit">Done ${icon('chevronDown', 12)}</button>`
            : h`<button type="button" class="n-runchips" data-act="edit" aria-expanded="false">${chips}<span class="edit">Edit ${icon('chevronDown', 12)}</span></button>`}
          <div class="n-money">
            <div class="m big"><i>NET TOTAL</i><b>${money(t.total)}</b><span style="color:var(--muted-fg)">SAR</span></div>
            <div class="m disc"><i>TOTAL DISCOUNT</i><b>−${money(t.discount)}</b></div>
            <div class="m"><i>TAX</i><b>${money(t.tax)}</b></div>
            <span class="calc">Calc: ${t.calcMs} ms</span>
          </div>
          ${runCtl}
        </div>
        ${ui.simEdit ? form : ''}
        ${ui.simBusy ? '<div class="n-sweep" aria-hidden="true"></div>' : ''}
      </section>
      <section class="card" aria-label="Items">
        <div class="card-h"><h2>Items</h2><span class="count">${s.items.length}</span><span class="sp"></span><button type="button" class="btn btn-secondary btn-sm">${icon('plus', 12)}Add item</button></div>
        <table class="n-tbl"><colgroup><col><col style="width:110px"><col style="width:100px"><col style="width:160px"><col style="width:44px"></colgroup>
          <thead><tr><th>Material</th><th>Qty</th><th>UoM</th><th>Control</th><th></th></tr></thead><tbody>
          ${s.items.map((it, i) => h`<tr><td><input id="near-mat-${i}" class="inp" value="${esc(it.material)}" aria-label="Material"></td><td><input id="near-qty-${i}" class="inp num" type="number" value="${it.qty}" aria-label="Quantity"></td><td><input id="near-uom-${i}" class="inp" value="${esc(it.uom)}" aria-label="Unit of measure"></td><td><input id="near-ctl-${i}" class="inp" value="${esc(it.control)}" aria-label="Control"></td><td><button type="button" class="btn btn-text btn-sm" aria-label="Remove item">${icon('trash', 13)}</button></td></tr>`)}
          </tbody></table>
        <div class="n-manual">
          <div class="n-manual-h"><button type="button" class="tg" data-act="manual" aria-expanded="${ui.manualOpen}">${icon(ui.manualOpen ? 'chevronDown' : 'chevronRight', 13)}Manual Conditions</button><span class="count">0 rows</span><span style="flex:1"></span><button type="button" class="btn btn-ghost btn-sm">${icon('plus', 12)}Add condition</button></div>
          ${ui.manualOpen ? '<div class="n-manual-b"><div style="color:var(--muted-fg);padding:6px 0">No manual conditions.</div><div class="hint">Item number = (line position) × 10, or 0 for a header condition.</div></div>' : ''}
        </div>
      </section>
      <div class="n-split">
        <section class="card" aria-label="Results">
          <div class="card-h"><h2>Results</h2><span class="count">${s.lines.length} lines</span><span class="sp"></span><span style="color:var(--muted-fg)">Select a line to see its pricing rules</span></div>
          <table class="n-tbl n-res"><colgroup><col style="width:58px"><col><col style="width:86px"><col style="width:96px"><col style="width:80px"><col style="width:76px"><col style="width:112px"></colgroup>
            <thead><tr><th>#</th><th>Item</th><th>Qty</th><th>Promotion</th><th class="end">Was</th><th class="end">Saved</th><th class="end">Net total</th></tr></thead>
            <tbody>${lines}</tbody></table>
        </section>
        <section class="card n-promos" aria-label="Promotions">
          <div class="card-h"><h2>Promotions</h2><span class="fired">1 fired</span></div>
          <div class="pcard">
            <div class="pcard-h"><span class="glyph" aria-hidden="true">${esc(f.kind)}</span><div><b>${esc(f.title)}</b><span class="d">${esc(f.desc)}</span><div class="id mono">${esc(f.bby)} · promo ${esc(f.promo)} · applied ${f.applied}× · ${f.usesLeft} use left · lines ${esc(f.lines)}</div></div><div class="saved"><i>SAVED</i><b class="num">${money(f.saved)}</b> <span style="font-size:10.5px;color:var(--muted-fg)">SAR</span></div></div>
            <div class="bg">
              <div class="bg-box"><i>BUY</i>${f.buy.map((b) => b.q + '× ' + esc(b.desc) + ' <span class="mono">' + b.mat + '</span><div class="num" style="text-align:end">' + money(b.amt) + '</div>')}</div>
              <div class="bg-arrow">${icon('arrowRight', 16)}</div>
              <div class="bg-box get"><i>GET · % OFF</i>${f.get.map((g) => g.q + '× ' + esc(g.desc) + ' <span class="bdg bdg-ok" style="height:16px;font-size:10px">' + esc(g.tag) + '</span><div class="num" style="text-align:end;font-weight:600">' + money(g.amt) + '</div>')}</div>
            </div>
            <button type="button" class="btn btn-text btn-sm" style="margin-block-start:8px">Bonus buy details ↗</button>
          </div>
          <div class="miss-h">Could have applied <span class="count">1 near-miss</span></div>
          <div class="miss">
            <button type="button" class="miss-top" data-act="miss" aria-expanded="${ui.missOpen}" style="width:100%;border:0;background:transparent;font:inherit;color:inherit;padding:0;cursor:pointer;text-align:start"><span class="ring"></span><span><b>${esc(miss.name)}</b><br><small class="mono" style="color:var(--ink-3)">${esc(miss.bby)} · promo ${esc(miss.promo)} · ${esc(miss.kind)}</small></span><span class="gv">GIVES <b>${esc(miss.gives)}</b></span></button>
            ${ui.missOpen ? h`<div class="meter"><i style="width:${(miss.have / miss.need) * 100}%"></i></div><div class="sub">${esc(miss.scope)} · <b>${miss.have} of ${miss.need}</b> — Basket has ${miss.have} of the ${miss.need} required.</div>` : ''}
          </div>
        </section>
      </div>`;

    mount.innerHTML = shell(ctx, 'sim', ['Pricing & Promotions', 'POS Simulation'], page);
    wireShell(mount, ctx);

    const process = () => {
      if (ui.simBusy) return;
      ui.simBusy = true; ui.simEdit = false; ctx.rerender();
      setTimeout(() => { ui.simBusy = false; if (ctx.state.dir === 'near' && ctx.state.screen === 'sim') ctx.rerender(); }, 900);
    };
    mount.onclick = (e) => {
      const tEl = e.target.closest('[data-act],[data-line]');
      if (!tEl) return;
      const a = tEl.dataset.act;
      if (a === 'nav') { ui.nav = !ui.nav; ctx.rerender(); }
      else if (a === 'edit') { ui.simEdit = !ui.simEdit; ctx.rerender(); }
      else if (a === 'process') process();
      else if (a === 'manual') { ui.manualOpen = !ui.manualOpen; ctx.rerender(); }
      else if (a === 'miss') { ui.missOpen = !ui.missOpen; ctx.rerender(); }
      else if (tEl.dataset.line) { const p = +tEl.dataset.line; ui.simOpen[p] = !ui.simOpen[p]; ctx.rerender(); }
    };
    mount.onkeydown = (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.line) { e.preventDefault(); const p = +e.target.dataset.line; ui.simOpen[p] = !ui.simOpen[p]; ctx.rerender(); }
    };
    document.onkeydown = (e) => { if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); process(); } };
  }

  /* =====================================================================
     CALL CENTER
     ===================================================================== */
  const PAY = [
    { v: 'Cash on delivery', d: 'The driver collects the total at the door.' },
    { v: 'Card on delivery', d: 'The driver brings a card terminal.' },
    { v: 'Paid online', d: 'The caller gets a payment link by SMS.' },
  ];
  function basket() {
    if (!ui.ccBasket) ui.ccBasket = window.DATA.cc.basket.map((b) => Object.assign({}, b));
    return ui.ccBasket;
  }
  function totals() {
    const b = basket();
    const incl = b.reduce((a, l) => a + l.total + (l.offer ? l.offer.amt : 0), 0);
    const items = incl / 1.15;
    const r = window.DATA.cc.receipt;
    const waived = incl >= r.freeOver;
    const delivery = waived ? 0 : r.delivery;
    return { items, vat: incl - items, delivery, waived, total: incl + delivery };
  }

  function renderCc(mount, ctx) {
    const { icon, esc, h, money } = ctx;
    const c = window.DATA.cc;
    const b = basket();
    const tt = totals();
    const chips = c.chips.map((ch) => {
      let st = ch.st, v = ch.v;
      if (ch.k === 'Payment' && ui.ccPayment) { st = 'settled'; v = ui.ccPayment; }
      return '<button type="button" class="ccchip ' + st + '" data-chip="' + ch.k + '" aria-expanded="' + (ui.ccChip === ch.k) + '"><i>' + esc(ch.k.toUpperCase()) + '</i>' + (v ? esc(v) : 'not set') + (ch.hint ? ' <small>(' + esc(ch.hint) + ')</small>' : '') + '</button>';
    }).join('');

    let section = '';
    if (ui.ccChip === 'Payment') {
      section = h`<div class="ccsec"><div class="ccsec-h">How are they paying?<button type="button" class="btn btn-text btn-sm" data-act="close" aria-label="Close (esc)">${icon('x', 13)}</button></div>
        <div class="opts">${PAY.map((p) => '<button type="button" class="opt" data-pay="' + esc(p.v) + '" aria-pressed="' + (ui.ccPayment === p.v) + '"><b>' + esc(p.v) + '</b><span>' + esc(p.d) + '</span></button>')}</div></div>`;
    } else if (ui.ccChip === 'Coupon') {
      section = h`<div class="ccsec"><div class="ccsec-h">Coupon<button type="button" class="btn btn-text btn-sm" data-act="close" aria-label="Close (esc)">${icon('x', 13)}</button></div>
        <div style="padding:10px;display:grid;gap:8px"><div style="display:flex;gap:8px;align-items:end"><label class="fld" style="flex:1"><span>Coupon code</span><input id="near-coupon" class="inp" placeholder="Read the code from the caller"></label><button type="button" class="btn btn-secondary" style="height:32px">Apply</button></div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:var(--attention-050);color:var(--attention-800)"><span><b>SAVE20</b> · 20% off oral care — needs one oral care item in the basket</span><button type="button" class="btn btn-text btn-sm">Remove</button></div></div></div>`;
    } else if (ui.ccChip) {
      section = h`<div class="ccsec"><div class="ccsec-h">${esc(ui.ccChip)}<button type="button" class="btn btn-text btn-sm" data-act="close" aria-label="Close (esc)">${icon('x', 13)}</button></div><div style="padding:10px;color:var(--muted-fg)">This section opens inline, exactly where the chip row is — the operator never leaves the order.</div></div>`;
    }

    const results = c.search.rows.map((r) => h`<div class="sres-r"><div><b>${esc(r.title)}</b><small><span class="mono">${esc(r.item)}</span> · <span lang="ar" dir="rtl">${esc(r.ar)}</span> · ≈${money(r.est)}</small></div>
      <span class="atp atp-${r.atp}">${r.atp === 'unk' ? '?' : ''}${esc(r.atpText)}</span>
      <button type="button" class="btn btn-primary btn-sm" data-add="${esc(r.item)}">${icon('plus', 12)}Add</button></div>`).join('');

    const lines = b.map((l, i) => h`<div class="bline${l.below ? ' below' : ''}"><div class="bline-r">
        <div><b>${esc(l.title)}</b><small class="mono">${esc(l.item)}</small>${l.below ? ' <small class="flag">· accepted below availability</small>' : ''}</div>
        <span class="atp atp-${l.below ? 'neg' : 'pos'}">${esc(l.atp)}</span>
        <input id="near-bq-${i}" class="inp inp-sm num" type="number" min="1" value="${l.qty}" aria-label="Quantity" data-bq="${i}">
        <select id="near-bu-${i}" class="inp inp-sm" aria-label="Unit of measure"><option>${esc(l.uom)}</option></select>
        <span class="amt">${money(l.total)}</span>
        <button type="button" class="btn btn-text btn-sm" data-void="${i}" aria-label="Void line">${icon('x', 13)}</button></div>
        <div class="why">Priced by <span class="mono">VKP0</span> · ${l.offer ? '<span class="off">OFFER ' + esc(l.offer.desc) + ' ' + money(l.offer.amt) + '</span> <span class="mono">' + esc(l.offer.id) + '</span>' : 'no offer'}</div></div>`).join('') || '<div style="padding:12px 14px;color:var(--muted-fg)">Nothing added yet.</div>';

    const offers = c.offers.filter((o) => o.state !== 'blocked').map((o) => {
      const open = ui.ccOfferOpen === o.id && o.state === 'reach';
      return h`<div class="ocard${open ? ' open' : ''}${o.state === 'counted' ? ' counted' : ''}">
        <div class="ocard-h"><b>${esc(o.head)}</b><span class="st">${o.state === 'counted' ? icon('check', 11) + ' already counted' : '○ within reach'}</span></div>
        <div class="d">${esc(o.desc)} · <span class="mono">${esc(o.id)}</span></div>
        <div class="meter${o.state === 'counted' ? '' : ' pri'}"><i style="width:${(o.have / o.need) * 100}%"></i></div>
        <div class="set">${o.have} of ${o.need}${o.state === 'reach' ? ' · add 1 more · ' + esc(o.set) : ''}</div>
        ${open ? h`<div style="margin-block-start:8px;font-weight:600">Add one of these:</div>${o.picks.map((p) => '<div class="opick"><span>' + esc(p.title) + ' <small class="mono">' + p.item + '</small></span><small>≈' + money(p.est) + ' · ' + p.atp + ' in stock</small><button type="button" class="btn btn-secondary btn-sm" data-add="' + p.item + '">Add</button></div>')}<button type="button" class="btn btn-text btn-sm">Search the other 39 — filtered to this offer</button>` : o.state === 'reach' ? '<button type="button" class="btn btn-text btn-sm" data-offer="' + o.id + '">Show items</button>' : ''}
      </div>`;
    }).join('');

    const blockers = ui.ccPayment ? [] : c.blockers;
    const receipt = ui.ccPlaced
      ? h`<div class="placed">${icon('check', 18)}<div style="font-weight:600;margin-block-start:4px">Order placed</div><div style="font-size:11px">Order number</div><b>1000080512</b><div style="font-size:12px;color:var(--foreground)">Read this number to the caller.</div></div>
          <button type="button" class="btn btn-secondary btn-block" data-act="next">Start the next order</button>`
      : h`${blockers.length ? '<div class="blockers">Needed first: ' + blockers.map(esc).join(' · ') + '</div>' : '<div class="ready">' + icon('check', 13) + 'Ready to place</div>'}
          <button type="button" class="btn btn-primary btn-block" data-act="place" ${blockers.length ? 'disabled' : ''}>Place order</button>`;

    const page = h`
      ${pageHeader(ctx, 'Call center', 'Console', h`<span>New order for an attached caller</span><span class="sep">|</span><span><kbd>Ctrl K</kbd> for every act</span>`, h`<button type="button" class="btn btn-outline">${icon('history', 13)}Recent orders</button>`)}
      <section class="n-cc" aria-label="Order console">
        <div class="n-cc-top"><b>New order</b><span class="doc mono">${esc(c.docType)}</span><span class="sp"></span>
          <span class="reach">${icon('gift', 12)}1 offer within reach</span>
          <span class="meta">Store ${esc(c.store.split(' ')[0])} · ${esc(c.operator)}</span>
          <button type="button" class="n-iconbtn" aria-label="Refresh this order">${icon('refresh', 15)}</button>
          <button type="button" class="btn btn-danger-o btn-sm">Abandon order</button></div>
        <div class="n-cc-cols">
          <aside class="n-cc-rail" aria-label="Caller">
            <div><div class="sec-t">Caller</div>
              <div class="caller"><button type="button" class="btn btn-text btn-sm x" aria-label="Remove this caller">${icon('x', 13)}</button>
                <div class="nm">${esc(c.caller.name)}</div>
                <div class="cf"><div><i>Mobile</i><span>${esc(c.caller.mobile)}</span></div><div><i>Member</i><span class="mono">${esc(c.caller.member)}</span></div><div><i>Tier</i><span>${esc(c.caller.tier)}</span></div><div><i>Points</i><span>${ctx.int(c.caller.points)}</span></div></div>
              </div>
              <div class="req" style="margin-block-start:8px">This caller has <b>${c.requests} open requests</b>. <a class="lnk" href="#" onclick="return false">View the requests</a></div>
            </div>
            <div><div class="sec-t">Address <a class="lnk" href="#" onclick="return false" style="text-transform:none;letter-spacing:0;font-size:11.5px">Change</a></div>
              <div class="addr"><b>${esc(c.address.label)}</b><span>${esc(c.address.line)} · ${esc(c.address.district)} · ${esc(c.address.city)}</span></div></div>
          </aside>
          <div class="n-cc-mid">
            <div class="ccchips">${chips}</div>
            ${section}
            <div class="ccblock">
              <label class="srch">${icon('search', 14)}<input id="near-cc-search" class="inp" value="${esc(ui.ccQuery)}" placeholder="Search items — name, Arabic name, or item number · Ctrl+K for everything else" aria-label="Search items"></label>
              <div class="srch-note">Catalogue prices are estimates before VAT — the basket price is what the caller pays.</div>
              <div class="sres">${results}</div>
            </div>
            <div class="bsk-h"><b>Basket</b><span>· prices include VAT · ${b.length} lines</span></div>
            ${lines}
            <div class="offers"><div class="sec-t" style="margin:0">Offers within reach <span class="reach" style="text-transform:none;letter-spacing:0">1 offer within reach</span></div>
              <div class="offers-note">Buy-one-get-one offers aren't checked yet — this list covers discounts only.</div>
              <div class="ogrid">${offers}</div>
              <div class="unreach">1 more offer can't be reached from this basket — Buy 2 get 1 · vitamins: can't be checked from this basket.</div>
            </div>
          </div>
          <aside class="n-cc-rcpt" aria-label="The caller pays">
            <div class="sec-t">The caller pays</div>
            <div class="rrow"><span>Items</span><span>${money(tt.items)} SAR</span></div>
            <div class="rrow"><span>VAT</span><span>${money(tt.vat)} SAR</span></div>
            <div class="rrow"><span>Delivery</span>${tt.waived ? '<span class="waived">waived</span>' : '<span>' + money(tt.delivery) + ' SAR</span>'}</div>
            <div class="rhint">${tt.waived ? 'This basket is over the free-delivery threshold.' : 'Delivery is free over ' + money(c.receipt.freeOver) + ' SAR.'}</div>
            <div class="rtotal"><span>Total</span><b>${money(tt.total)}<small>SAR</small></b></div>
            <div class="rfoot">${receipt}</div>
          </aside>
        </div>
      </section>`;

    mount.innerHTML = shell(ctx, 'cc', ['Call center', 'Console'], page, true);
    wireShell(mount, ctx);

    const addItem = (item) => {
      const bk = basket();
      const ex = bk.find((l) => l.item === item);
      if (ex) { ex.qty += 1; ex.total = +(ex.unit * ex.qty).toFixed(2); }
      else {
        const src = c.search.rows.find((r) => r.item === item) || (c.offers[0].picks || []).find((p) => p.item === item);
        if (!src) return;
        const unit = +(src.est * 1.15).toFixed(2);
        const below = src.atp === 'neg';
        bk.push({ item, title: src.title, qty: 1, uom: 'EA', unit, total: unit, atp: below ? 'none at add' : src.atp === 'unk' ? '? unknown at add' : (typeof src.atp === 'number' ? src.atp : (src.atpText || '').split(' ')[0]) + ' at add', offer: null, below });
      }
      ui.ccPlaced = false;
      ctx.rerender();
    };
    mount.onclick = (e) => {
      const t = e.target.closest('[data-act],[data-chip],[data-pay],[data-add],[data-void],[data-offer]');
      if (!t) return;
      const a = t.dataset.act;
      if (a === 'nav') { ui.nav = !ui.nav; ctx.rerender(); }
      else if (a === 'close') { ui.ccChip = null; ctx.rerender(); }
      else if (a === 'place') { ui.ccPlaced = true; ctx.rerender(); }
      else if (a === 'next') { ui.ccPlaced = false; ui.ccPayment = ''; ui.ccBasket = null; ui.ccChip = null; ctx.rerender(); }
      else if (t.dataset.chip) { ui.ccChip = ui.ccChip === t.dataset.chip ? null : t.dataset.chip; ctx.rerender(); }
      else if (t.dataset.pay) { ui.ccPayment = t.dataset.pay; ui.ccChip = null; ctx.rerender(); }
      else if (t.dataset.add) addItem(t.dataset.add);
      else if (t.dataset.void) { basket().splice(+t.dataset.void, 1); ctx.rerender(); }
      else if (t.dataset.offer) { ui.ccOfferOpen = t.dataset.offer; ctx.rerender(); }
    };
    mount.onchange = (e) => {
      if (e.target.dataset.bq != null) {
        const l = basket()[+e.target.dataset.bq];
        l.qty = Math.max(1, +e.target.value || 1); l.total = +(l.unit * l.qty).toFixed(2);
        if (l.offer && l.qty < 2) l.offer = null;
        ctx.rerender();
      }
    };
    mount.oninput = (e) => { if (e.target.id === 'near-cc-search') ui.ccQuery = e.target.value; };
    document.onkeydown = (e) => { if (e.key === 'Escape' && ui.ccChip) { ui.ccChip = null; ctx.rerender(); } };
  }

  /* =====================================================================
     registration + adoption notes
     ===================================================================== */
  window.DIRS.near = {
    tag: 'Near',
    label: 'Steel Enterprise',
    render(screen, mount, ctx) {
      if (screen === 'details') renderDetails(mount, ctx);
      else if (screen === 'sim') renderSim(mount, ctx);
      else if (screen === 'cc') renderCc(mount, ctx);
      else renderList(mount, ctx);
      if (!mount.onclick) mount.onclick = (e) => { if (e.target.closest('[data-act="nav"]')) { ui.nav = !ui.nav; ctx.rerender(); } };
    },
    notes: {
      direction: {
        idea: 'Keep everything you approved in tickets 355 and 356: the steel palette, the 28px rows and buttons, 32px inputs, square cards, and the badge and command families. Then give it a real enterprise frame: a persistent sidebar grouped by area, a 44px top bar with breadcrumb, global search and the store context, and one page-header pattern on every screen. Nothing changes the way an operator works.',
        system: [
          'Colour work is close to zero: the tokens are the ones already in src/app/global.css, and src/core/theme/ag-grid-theme.ts keeps its single params block. Only wrapperBorderRadius changes (10 → 0) to match the selected preview.',
          'New in src/layout/: a sidebar component built from the existing layout/menu-model.ts groups, with collapse kept in a zustand flag. A breadcrumb and a top bar replace the current header strip.',
          'New in src/core/ui/: one PageHeader (eyebrow, h1, meta, actions) that every Page uses instead of its own title row.',
          'Button and StatusBadge keep their variants. The corner radius moves from rounded-full to 3px, which is the 356 decision, so it is a class change in two files.',
          'This is the only direction that can ship screen by screen with no visual seam between migrated and unmigrated screens.',
        ],
      },
      list: {
        retheme: 'Small', rebuild: 'Small',
        changes: [
          'The Graphite command strip replaces the 14-control auto-fill grid in FilterPanel.tsx: five fields visible, nine under All filters in four groups, and Search applies the draft.',
          'Applied-filter chips and the "Changes not applied" state come from the 355 answer; the strip shows the result limit at all times.',
          'Scope tabs with live counts (All, Failed jobs, Rescheduled) are new. They are grid quick-filters over the loaded rows, not new server queries.',
          'Pinned Delivery no., a Status badge column and a Dawaa Now tag replace the plain Yes/No text in columns.ts.',
        ],
        keeps: ['DeliveryFilterCriteria and buildDeliveryQuery semantics.', 'Saved views (ViewManager), the column chooser and Export.', '28px rows, native text selection and Ctrl+C copying.'],
        risks: ['Status, Failed jobs and Dawaa Now need cellRenderers, so columns.ts stops being plain column definitions.', 'Scope counts are only as true as the loaded limit (200 by default); the tab label must not read as a server total.'],
      },
      details: {
        retheme: 'Small', rebuild: 'None',
        changes: [
          'The identity band, status rail, labelled action clusters, summary rail and tabbed work area are the approved 356 layout. They now sit under the shared page header and breadcrumb.',
          'Prescription and "added later" provenance appear as pills in the header meta line, so they can be seen without opening the rail.',
          'Items gets a pinned Description column and the pinned totals footer, and deleted lines show with a line-through.',
        ],
        keeps: ['IdentityBand, StatusRail, CommandPanel, SummaryRail and DetailGrid as they are now.', 'Command families: fulfilment green, cancellation request indigo, and danger only for the terminal pair.', 'Disabled-reason tooltips via aria-disabled.'],
        risks: ['The page header and the identity band both show the delivery number. One of them may need to lose it after review.', 'At 1280px wide, the 340px rail plus the tabs is tight. The existing 900px container query must keep working inside the new shell, which is 220px narrower.'],
      },
      sim: {
        retheme: 'Small', rebuild: 'None',
        changes: [
          'This is the approved 098–106 arrangement (run strip, items card, 66/34 Results and Promotions) under the shared page header.',
          'The sample-basket selector moves into the page-header actions instead of a separate preview bar.',
          'The tables use the grid header treatment (muted ground, uppercase 10.5px), so plain tables and AG Grid look the same.',
        ],
        keeps: ['SimRunStrip, SimResultsGrid, SimPromotionsRail and SimPromoBlocks logic.', 'Ctrl+Enter to process, and the stale-inputs status slot.', 'The 900px container queries.'],
        risks: ['With the sidebar expanded, the work area falls below 900px on a 1280px screen and flips Promotions above Results. Collapse the rail by default on this route.'],
      },
      cc: {
        retheme: 'Small', rebuild: 'Small',
        changes: [
          'The console keeps Variant A (260 | flex | 320) but now lives inside the app shell instead of the full-viewport /callcenter route.',
          'Chips open their section inline under the row. Payment shows as three choice cards, and choosing one clears the blocker and enables Place order.',
          'Offers within reach and the receipt use the same card and badge vocabulary as OMS.',
        ],
        keeps: ['ConsoleShell column logic, header-chips states (settled, needs attention, unset) and the opening steps.', 'Server-authoritative totals and submit gating.', 'The Ctrl+K command palette (still to be shown in this direction).'],
        risks: ['Agents lose about 220px of width to the sidebar. The rail should auto-collapse on /callcenter, or the route should keep its full-viewport mode as an option.', 'The page header costs about 60px of height that the centre column needs at 900px tall.'],
      },
    },
  };
})();

</script>
<script>
/* MID — Fiori Horizon-style direction: List Report, Object Page, Dynamic Page, Flexible Column Layout. */
(function () {
  'use strict';
  window.DIRS = window.DIRS || {};

  /* one params object for every grid in this direction (core caches the theme per direction) */
  const GP = {
    fontFamily: "'Noto Sans', 'Noto Sans Arabic', Arial, sans-serif",
    fontSize: 13, headerFontSize: 13, headerFontWeight: 600, spacing: 6,
    wrapperBorder: false, wrapperBorderRadius: 0, columnBorder: false, headerColumnBorder: false,
  };

  /* view state for this direction (kept across re-renders) */
  const S = {
    fbOpen: true, dirty: false,
    shown: ['from', 'to', 'store', 'delno', 'phone'],
    values: { from: '2026-10-01', to: '2026-10-03', limit: '200' },
    applied: { from: '2026-10-01', to: '2026-10-03', limit: '200' },
    simHead: true, simTab: 'results', open: { 10: true },
    payment: '', fulfil: 'Delivery', placed: false, offerOpen: true, strip: true,
  };

  const FILTERS = [
    { key: 'from', label: 'From Date', type: 'date', group: 'Basic' },
    { key: 'to', label: 'To Date', type: 'date', group: 'Basic' },
    { key: 'store', label: 'Store Code', type: 'text', group: 'Basic' },
    { key: 'delno', label: 'Delivery No', type: 'text', group: 'Basic' },
    { key: 'phone', label: 'Customer Phone', type: 'tel', group: 'Basic' },
    { key: 'docno', label: 'Document No', type: 'text', group: 'Document Identity' },
    { key: 'orderno', label: 'Order No', type: 'text', group: 'Document Identity' },
    { key: 'doctype', label: 'Document Type', type: 'select', options: ['Call Center', 'Web Order', 'Store Order'], group: 'Classification' },
    { key: 'source', label: 'Document Source', type: 'select', options: ['Call center', 'Web', 'Store'], group: 'Classification' },
    { key: 'deldoctype', label: 'Delivery Document Type', type: 'select', options: ['Standard Delivery', 'Return Delivery'], group: 'Classification' },
    { key: 'reason', label: 'Reason', type: 'text', group: 'Classification' },
    { key: 'deltype', label: 'Delivery Type', type: 'select', options: ['Delivery', 'PickInStore'], group: 'Fulfilment' },
    { key: 'dawaa', label: 'Dawaa Now', type: 'select', options: ['Yes', 'No'], group: 'Fulfilment' },
    { key: 'limit', label: 'Limit', type: 'number', group: 'Results' },
  ];
  const FMAP = {}; FILTERS.forEach((f) => { FMAP[f.key] = f; });

  const STATUS = {
    'Ready': ['neu', 'box', 'Ready'],
    'Delivered': ['pos', 'check', 'Delivered'],
    'Cancelled': ['neg', 'ban', 'Cancelled'],
    'Cancellation requested': ['indigo', 'alert', 'Cancellation Requested'],
    'Out for delivery': ['info', 'truck', 'Out for Delivery'],
  };

  let RT = null; // ctx, set on render
  const I = (n, s) => RT.icon(n, s || 16);
  const E = (s) => RT.esc(s);
  const M = (v) => RT.money(v);
  const neg = (v) => '−' + RT.money(Math.abs(v));
  const os = (cls, ic, text, inv) => '<span class="m-os ' + cls + (inv ? ' inv' : '') + '">' + (ic ? I(ic, 14) : '') + E(text) + '</span>';

  function toast(mount, text) {
    const sh = mount.querySelector('.m-shell');
    if (!sh) return;
    const old = sh.querySelector('.m-toast'); if (old) old.remove();
    const t = document.createElement('div');
    t.className = 'm-toast'; t.setAttribute('role', 'status'); t.textContent = text;
    sh.appendChild(t);
    setTimeout(() => t.remove(), 2400);
  }

  /* ---------- shell ---------- */
  function shell(appTitle, page) {
    const h = RT.h;
    return h`
    <div class="m-shell">
      <header class="m-shellbar">
        <button type="button" class="m-prod" data-act="prod" aria-haspopup="menu" aria-expanded="false" aria-controls="mid-prod-menu">
          <span class="m-mark">ad</span><b>BackOffice</b><span>${E(appTitle)}</span>${I('chevronDown', 14)}
        </button>
        <label class="m-search">${I('search', 16)}<input id="mid-shell-search" type="search" placeholder="Search deliveries, documents, customers" aria-label="Search"></label>
        <div class="m-shell-end">
          <button type="button" class="m-iconbtn" aria-label="Notifications (3)">${I('bell', 18)}<span class="m-badge">3</span></button>
          <button type="button" class="m-iconbtn" aria-label="Help">${I('info', 18)}</button>
          <span class="m-avatar" aria-label="Signed in as MS">MS</span>
        </div>
      </header>
      <div class="m-pop" id="mid-prod-menu" role="menu" hidden style="inset-block-start:46px; inset-inline-start:10px">
        <div class="m-pop-h">OMS</div>
        <button type="button" class="m-mi" role="menuitem" data-go="list">${I('truck')}Delivery Documents</button>
        <button type="button" class="m-mi" role="menuitem" data-go="details">${I('file')}Delivery 8000048</button>
        <hr><div class="m-pop-h">Pricing &amp; Promotions</div>
        <button type="button" class="m-mi" role="menuitem" data-go="sim">${I('tag')}POS Simulation</button>
        <hr><div class="m-pop-h">Call Center</div>
        <button type="button" class="m-mi" role="menuitem" data-go="cc">${I('headset')}Console</button>
      </div>
      <div class="m-page">${page}</div>
    </div>`;
  }

  /* close open popovers unless the click is inside one or on its toggle */
  function closePops(mount, e) {
    mount.querySelectorAll('.m-pop:not([hidden])').forEach((p) => {
      const tog = mount.querySelector('[aria-controls="' + p.id + '"], [data-act="' + (p.dataset.toggle || '') + '"]');
      if (p.contains(e.target) || (tog && tog.contains(e.target))) return;
      p.hidden = true;
      if (tog) tog.setAttribute('aria-expanded', 'false');
    });
  }
  function togglePop(mount, id, btn) {
    const p = mount.querySelector('#' + id);
    p.hidden = !p.hidden;
    btn.setAttribute('aria-expanded', String(!p.hidden));
  }
  function common(mount, e, t) {
    if (!t) return false;
    if (t.dataset.act === 'prod') { togglePop(mount, 'mid-prod-menu', t); return true; }
    return false;
  }

  /* ================= LIST REPORT ================= */
  function activeKeys(vals) { return FILTERS.filter((f) => f.key !== 'limit' && vals[f.key]).map((f) => f.key); }
  function applyFilters() {
    const v = S.applied;
    const has = (a, b) => String(a).toLowerCase().includes(String(b).toLowerCase());
    let rows = window.DATA.deliveries.filter((r) =>
      (!v.from || r.date >= v.from) && (!v.to || r.date <= v.to) &&
      (!v.store || has(r.store, v.store)) && (!v.delno || has(r.deliveryNo, v.delno)) &&
      (!v.phone || has(r.mobile, v.phone)) && (!v.docno || has(r.documentNo, v.docno)) &&
      (!v.orderno || has(r.orderNo, v.orderno)) && (!v.doctype || r.documentType === v.doctype) &&
      (!v.source || r.source === v.source) && (!v.deldoctype || r.deliveryDocType === v.deldoctype) &&
      (!v.reason || has(r.reason, v.reason)) && (!v.deltype || r.deliveryType === v.deltype) &&
      (!v.dawaa || (v.dawaa === 'Yes') === r.dawaaNow));
    const lim = parseInt(v.limit, 10);
    if (lim > 0) rows = rows.slice(0, lim);
    return rows;
  }
  function fieldHtml(f, val, id) {
    const v = val == null ? '' : val;
    let ctl;
    if (f.type === 'select') {
      ctl = '<select class="m-input" id="' + id + '" data-f="' + f.key + '"><option value="">Any</option>' +
        f.options.map((o) => '<option' + (o === v ? ' selected' : '') + '>' + E(o) + '</option>').join('') + '</select>';
    } else {
      ctl = '<input class="m-input" id="' + id + '" data-f="' + f.key + '" type="' + f.type + '" value="' + E(v) + '"' + (f.type === 'number' ? ' min="1" max="20000"' : '') + '>';
    }
    return '<div class="m-field"><label class="m-lab" for="' + id + '">' + E(f.label) + '</label>' + ctl + '</div>';
  }
  function filteredBy() {
    const k = activeKeys(S.applied);
    return k.length ? 'Filtered By (' + k.length + '): ' + k.map((x) => FMAP[x].label).join(', ') : 'Filtered By: None';
  }

  function renderList(mount) {
    const h = RT.h;
    const rows = applyFilters();
    const nActive = activeKeys(S.values).length;
    const head = h`
      <div class="m-dp-head${S.fbOpen ? '' : ' snap'}">
        <div class="m-title-row">
          <div class="grow">
            <button type="button" class="m-variant" data-act="variant" aria-label="Select view, current view Standard">
              <h1>Standard</h1><span class="dirty" ${S.dirty ? '' : 'hidden'}>*</span>${I('chevronDown', 18)}
            </button>
            ${S.fbOpen ? '' : '<div class="m-snapsum">' + E(filteredBy()) + '</div>'}
          </div>
          <button type="button" class="m-btn trans icon" data-act="toast" data-msg="Link to this view copied" aria-label="Share">${I('link', 16)}</button>
        </div>
        ${S.fbOpen ? h`
        <div class="m-fbar" role="search">
          ${S.shown.map((k) => fieldHtml(FMAP[k], S.values[k], 'mid-f-' + k))}
          <div class="acts">
            <button type="button" class="m-btn emph" data-act="go">Go</button>
            <button type="button" class="m-btn trans" data-act="adapt">Adapt Filters (${nActive})</button>
            <button type="button" class="m-btn trans" data-act="fb">Hide Filter Bar</button>
          </div>
        </div>` : ''}
        <button type="button" class="m-collapse" data-act="fb" aria-label="${S.fbOpen ? 'Collapse header' : 'Expand header'}">${I(S.fbOpen ? 'chevronDown' : 'chevronDown', 16).replace('<svg', '<svg style="transform:rotate(' + (S.fbOpen ? 180 : 0) + 'deg)"')}</button>
      </div>`;
    const content = h`
      <div class="m-dp-content">
        <section class="m-card m-tcard" aria-label="Delivery Documents">
          <div class="m-tb">
            <h2>Delivery Documents (<span id="mid-count">${rows.length}</span>)</h2>
            <span class="sp"></span>
            <button type="button" class="m-btn trans" data-act="open" disabled>Open</button>
            <button type="button" class="m-btn trans" data-act="toast" data-msg="Request Cancellation opens for the selected deliveries" id="mid-reqc" disabled>Request Cancellation</button>
            <span class="sep"></span>
            <button type="button" class="m-btn trans" data-act="toast" data-msg="Export to spreadsheet: ${rows.length} rows" aria-label="Export">${I('download')}${I('chevronDown', 12)}</button>
            <button type="button" class="m-btn trans icon" data-act="toast" data-msg="View Settings: columns, sort, filter, group" aria-label="View settings">${I('settings')}</button>
            <button type="button" class="m-btn trans icon" data-act="toast" data-msg="Table enters full screen" aria-label="Full screen">${I('maximize')}</button>
          </div>
          <div class="m-grid" id="mid-list-grid"></div>
        </section>
      </div>`;
    mount.innerHTML = shell('Delivery Documents', head + content + adaptDialog());

    const money = (p) => p.value == null ? '' : '<span class="num">' + M(p.value) + '</span><span class="unit">SAR</span>';
    const yn = (p) => (p.value ? 'Yes' : 'No');
    const api = RT.grid(mount.querySelector('#mid-list-grid'), GP, {
      rowData: rows, rowHeight: 32, headerHeight: 36,
      rowSelection: { mode: 'multiRow', checkboxes: true, headerCheckbox: true, enableClickSelection: true },
      selectionColumnDef: { pinned: 'left', width: 44, maxWidth: 44 },
      columnDefs: [
        { field: 'deliveryNo', headerName: 'Delivery No', pinned: 'left', width: 140, sort: 'desc', cellClass: 'm-idcell',
          cellClassRules: { 'm-hl-neg': (p) => !!(p.data && p.data.failedJobs > 0), 'm-hl-crit': (p) => !!(p.data && !p.data.failedJobs && p.data.status === 'Cancellation requested') } },
        { field: 'customer', headerName: 'Customer Name', width: 170 },
        { field: 'status', headerName: 'Status', width: 205, cellRenderer: (p) => { const s = STATUS[p.value] || ['neu', '', p.value]; return os(s[0], s[1], s[2]); } },
        { field: 'store', headerName: 'Store Code', width: 122 },
        { field: 'date', headerName: 'Document Date', width: 148 },
        { field: 'slot', headerName: 'Slot', width: 118 },
        { field: 'netTotal', headerName: 'Net Total', type: 'rightAligned', width: 128, filter: 'agNumberColumnFilter', cellRenderer: money },
        { field: 'due', headerName: 'Amount Due', type: 'rightAligned', width: 132, filter: 'agNumberColumnFilter', cellRenderer: money },
        { field: 'failedJobs', headerName: 'Failed Jobs', type: 'rightAligned', width: 124, cellRenderer: (p) => (p.value > 0 ? os('neg', 'alert', String(p.value)) : '') },
        { field: 'dawaaNow', headerName: 'Dawaa Now', width: 124, cellRenderer: (p) => (p.value ? os('crit', 'zap', 'Yes') : '<span class="muted">No</span>') },
        { field: 'orderNo', headerName: 'Order No', width: 122 },
        { field: 'documentNo', headerName: 'Document No', width: 126 },
        { field: 'documentType', headerName: 'Doc. Type', width: 120 },
        { field: 'source', headerName: 'Doc. Source', width: 118 },
        { field: 'deliveryType', headerName: 'Delivery Type', width: 122 },
        { field: 'deliveryDocType', headerName: 'Delivery Doc. Type', width: 150 },
        { field: 'reason', headerName: 'Reason', width: 100 },
        { field: 'rescheduled', headerName: 'Rescheduled', width: 115, cellRenderer: yn },
        { field: 'lastAction', headerName: 'Last Action', width: 150 },
        { field: 'city', headerName: 'City Name', width: 112 },
        { field: 'note', headerName: 'Note', width: 280 },
        { colId: 'nav', headerName: '', pinned: 'right', width: 44, maxWidth: 44, sortable: false, filter: false, resizable: false, suppressHeaderMenuButton: true,
          cellClass: 'm-navcell', cellRenderer: () => I('chevronRight', 16),
          onCellClicked: (p) => RT.go('details', { sel: p.data.deliveryNo }) },
      ],
      onRowDoubleClicked: (p) => RT.go('details', { sel: p.data.deliveryNo }),
      onSelectionChanged: (ev) => {
        const n = ev.api.getSelectedRows().length;
        const ob = mount.querySelector('[data-act="open"]'); if (ob) ob.disabled = n !== 1;
        const rc = mount.querySelector('#mid-reqc'); if (rc) rc.disabled = n === 0;
        const c = mount.querySelector('#mid-count'); if (c) c.textContent = n ? n + ' of ' + rows.length + ' selected' : String(rows.length);
      },
    });

    mount.oninput = mount.onchange = (e) => {
      const f = e.target.dataset && e.target.dataset.f;
      if (!f) return;
      S.values[f] = e.target.value;
      S.dirty = true;
      const d = mount.querySelector('.m-variant .dirty'); if (d) d.hidden = false;
    };
    mount.onkeydown = (e) => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.f) { S.applied = Object.assign({}, S.values); RT.rerender(); } };
    mount.onclick = (e) => {
      closePops(mount, e);
      const t = e.target.closest('[data-act]');
      if (common(mount, e, t) || !t) return;
      const a = t.dataset.act;
      if (a === 'go') { S.applied = Object.assign({}, S.values); RT.rerender(); }
      else if (a === 'fb') { S.fbOpen = !S.fbOpen; RT.rerender(); }
      else if (a === 'adapt') { mount.querySelector('#mid-adapt').hidden = false; mount.querySelector('#mid-adapt input').focus(); }
      else if (a === 'adapt-cancel') { mount.querySelector('#mid-adapt').hidden = true; }
      else if (a === 'adapt-ok') {
        const keys = Array.from(mount.querySelectorAll('#mid-adapt input[data-k]:checked')).map((i) => i.dataset.k);
        S.shown = FILTERS.map((f) => f.key).filter((k) => keys.includes(k));

      }
      else if (a === 'open') { const r = api.getSelectedRows()[0]; if (r) RT.go('details', { sel: r.deliveryNo }); }
      else if (a === 'variant') toast(mount, 'Views: Standard (default) · Failed jobs triage · My store P019');
      else if (a === 'toast') toast(mount, t.dataset.msg);
    };

      <div class="m-itb" role="tablist" aria-label="Simulation">${tabs.map((t) => '<button type="button" role="tab" data-act="tab" data-tab="' + t[0] + '" aria-selected="' + (S.simTab === t[0]) + '">' + E(t[1]) + ' <span class="cnt">' + E(t[2]) + '</span></button>')}</div>`;

    const promoCell = (l) => (l.promo === 'fired' ? os('pos', 'check', 'Fired') : l.promo === 'W' ? os('crit', 'alert', 'Warning') : '<span class="muted">—</span>');
    const lineRows = s.lines.map((l) => {
      const canOpen = !!(l.conditions || l.message);
      const open = !!S.open[l.pos] && canOpen;
      const main = '<tr class="m-line" data-act="line" data-pos="' + l.pos + '" aria-expanded="' + open + '" tabindex="0">' +
        '<td style="width:56px">' + (canOpen ? '<span class="m-chev">' + I('chevronRight', 14) + '</span> ' : '<span style="display:inline-block;width:18px"></span>') + l.pos + '</td>' +
        '<td><span' + (l.total == null ? ' style="color:var(--crit)"' : '') + '>' + E(l.desc) + '</span><span class="sub num">' + E(l.material) + '</span></td>' +
        '<td class="r">' + l.qty + ' ' + E(l.uom) + (l.unit != null ? '<span class="sub num">× ' + M(l.unit) + '</span>' : '') + '</td>' +
        '<td>' + promoCell(l) + '</td>' +
        '<td class="r muted num">' + (l.was != null ? M(l.was) : '') + '</td>' +
        '<td class="r num">' + (l.saved ? '<span class="m-os pos">' + neg(l.saved) + '</span>' : '') + '</td>' +
        '<td class="r">' + (l.total != null ? '<span class="strong num">' + M(l.total) + '</span><span class="unit">SAR</span>' : '<i class="muted">Not priced</i>') + '</td></tr>';
      if (!open) return main;
      let body = '';
      if (l.conditions) {
        const net = +(l.total - l.conditions.filter((c) => c.stat).reduce((a, c) => a + c.value, 0)).toFixed(2);
        const tax = +(l.total - net).toFixed(2);
        body = '<div class="m-moneyfoot"><span>Net <b class="num">' + M(net) + '</b></span><span class="muted">+</span><span>Tax <b class="num">' + M(tax) + '</b></span><span class="muted">=</span><span>Net Total <b class="num">' + M(l.total) + '</b> SAR</span></div>' +
          '<div class="m-subtitle">Applied Pricing Rules</div><div class="m-sgrid"><table class="m-tbl"><thead><tr><th>#</th><th>Category</th><th>Condition</th><th>Description</th><th class="r">Rate</th><th class="r">Base</th><th class="r">Value</th></tr></thead><tbody>' +
          l.conditions.map((c) => '<tr><td>' + c.n + '</td><td>' + E(c.kind) + '</td><td class="num"><b>' + E(c.code) + '</b></td><td>' + E(c.name) +
            (c.kind === 'Promotion' ? '<span class="m-tag pos">PROMOTION</span>' : '') + (c.times ? '<span class="m-tag">×' + c.times + '</span>' : '') + (c.stat ? '<span class="m-tag neu">STAT</span>' : '') +
            '</td><td class="r num">' + E(c.rate) + '</td><td class="r num">' + E(c.base) + '</td><td class="r num">' + (c.value < 0 ? neg(c.value) : M(c.value)) + '</td></tr>').join('') +
          '</tbody></table></div>';
      } else if (l.message) {
        body = '<div class="m-ms warn">' + I('alert', 16) + '<span class="grow">' + E(l.message) + '</span></div>';
      }
      return main + '<tr class="m-exp"><td colspan="7">' + body + '</td></tr>';
    }).join('');

    const results = h`
      <div class="m-ms warn" role="status">${I('alert', 18)}<span class="grow"><b>Line 30 was not priced.</b> ${E(s.lines[2].message)}. Correct the line in Items, then simulate again.</span><button type="button" class="m-link" data-act="tab" data-tab="items">Go to Items</button></div>
      <section class="m-card" aria-label="Results">
        <div class="m-tb"><h2>Results (${s.lines.length})</h2><span class="sp"></span>
          <button type="button" class="m-btn trans" data-act="expandall">Expand All</button>
          <button type="button" class="m-btn trans icon" data-act="toast" data-msg="View Settings: columns, sort" aria-label="View settings">${I('settings')}</button></div>
        <table class="m-tbl">
          <thead><tr><th>Item</th><th>Description</th><th class="r">Quantity</th><th>Promotion</th><th class="r">Was</th><th class="r">Saved</th><th class="r">Net Total</th></tr></thead>
          <tbody>${lineRows}</tbody>
          <tfoot><tr><td></td><td>Basket</td><td></td><td></td><td class="r num muted">${M(wasSum)}</td><td class="r num"><span class="m-os pos">${neg(s.totals.discount)}</span></td><td class="r"><span class="strong num">${M(s.totals.total)}</span><span class="unit">SAR</span></td></tr></tfoot>
        </table>
      </section>`;

    const items = h`
      <section class="m-card" aria-label="Items">
        <div class="m-tb"><h2>Items (${s.items.length})</h2><span class="sp"></span><button type="button" class="m-btn trans" data-act="toast" data-msg="Item row added">${I('plus', 14)}Add Item</button></div>
        <table class="m-tbl"><thead><tr><th>Material</th><th class="r">Quantity</th><th>UoM</th><th>Control</th><th></th></tr></thead><tbody>
          ${s.items.map((it, i) => '<tr><td><input class="m-input' + (it.material === 'COUP01' ? ' warn' : '') + '" id="mid-it-m' + i + '" aria-label="Material" value="' + E(it.material) + '" style="max-width:200px"></td><td class="r"><input class="m-input" id="mid-it-q' + i + '" aria-label="Quantity" type="number" value="' + it.qty + '" style="max-width:90px; text-align:end"></td><td><input class="m-input" id="mid-it-u' + i + '" aria-label="UoM" value="' + E(it.uom) + '" style="max-width:80px"></td><td><input class="m-input" id="mid-it-c' + i + '" aria-label="Control" value="" style="max-width:140px"></td><td class="r"><button type="button" class="m-btn trans icon" aria-label="Remove item" data-act="toast" data-msg="Item removed">' + I('trash', 15) + '</button></td></tr>')}
        </tbody></table>
      </section>
      <section class="m-card" aria-label="Manual Conditions">
        <div class="m-tb"><h2>Manual Conditions (0)</h2><span class="sp"></span><button type="button" class="m-btn trans" data-act="toast" data-msg="Condition row added">${I('plus', 14)}Add Condition</button></div>
        <div style="padding:14px 16px" class="muted">No manual conditions. <span class="m-hint">Item number = (line position) × 10, or 0 for a header condition.</span></div>
      </section>`;

    const f = s.fired, mi = s.missed[0];
    const promos = h`
      <div class="m-promos">
        <section class="m-card m-pcard" aria-label="Fired promotion">
          <div class="m-tb" style="margin:-14px -16px 12px; padding-inline:16px"><h2>Fired (1)</h2></div>
          <div class="m-pcard-h">
            <span class="m-glyph" aria-hidden="true">%</span>
            <div class="grow"><h3>${E(f.title)}</h3><div class="muted">${E(f.desc)}</div>
              <div class="m-attrs"><span>Bonus Buy <b class="num">${E(f.bby)}</b></span><span>Promotion <b class="num">${E(f.promo)}</b></span><span>Applied <b>${f.applied}×</b></span><span><b>${f.usesLeft} use left</b></span><span>Lines <b>${E(f.lines)}</b></span></div></div>
            <div class="m-saved"><div class="lab">Saved</div><div class="v num">${M(f.saved)}<span class="unit">SAR</span></div></div>
          </div>
          <div class="m-bg">
            <div class="box"><h4>Buy</h4>${f.buy.map((b) => '<div class="ln"><b>' + b.q + '×</b><span class="grow">' + E(b.desc) + ' <span class="muted num">' + E(b.mat) + '</span></span><span class="num">' + M(b.amt) + '</span></div>')}</div>
            <div class="arrow">${I('arrowRight', 20)}</div>
            <div class="box get"><h4>Get · % off</h4>${f.get.map((g) => '<div class="ln"><b>' + g.q + '×</b><span class="grow">' + E(g.desc) + ' <span class="m-tag pos">' + E(g.tag) + '</span></span><span class="num m-os pos">' + neg(g.amt) + '</span></div>')}</div>
          </div>
          <div style="margin-block-start:10px"><button type="button" class="m-link" data-act="toast" data-msg="Bonus Buy details open in a new tab">Bonus Buy Details ${I('link', 12)}</button></div>
        </section>
        <section class="m-card m-pcard" aria-label="Could have applied">
          <div class="m-tb" style="margin:-14px -16px 12px; padding-inline:16px"><h2>Could Have Applied (1)</h2></div>
          <div class="m-pcard-h">
            <span class="m-glyph neu" aria-hidden="true">%</span>
            <div class="grow"><h3>${E(mi.name)}</h3>
              <div class="m-attrs"><span>Bonus Buy <b class="num">${E(mi.bby)}</b></span><span>Promotion <b class="num">${E(mi.promo)}</b></span><span>${E(mi.kind)}</span></div></div>
            <div class="m-saved"><div class="lab">Gives</div>${os('info', '', mi.gives)}</div>
          </div>
          <div class="m-prog" style="margin-block-start:14px"><span class="bar" role="progressbar" aria-valuenow="${mi.have}" aria-valuemin="0" aria-valuemax="${mi.need}" aria-label="Qualifying items"><i style="width:${Math.round(mi.have / mi.need * 100)}%"></i></span><b style="color:var(--text)">${mi.have} of ${mi.need}</b></div>
          <p style="margin-block-start:8px">Basket has ${mi.have} of the ${mi.need} required. <span class="muted">${E(mi.scope)}</span></p>
        </section>
      </div>`;

    const el0 = s.lines[0].elements;
    const elements = h`
      <section class="m-card" aria-label="Pricing Elements">
        <div class="m-tb"><h2>Pricing Elements</h2><span class="sp"></span>
          <label class="m-field" style="flex-direction:row; align-items:center; gap:8px"><span class="m-lab">Line</span><select class="m-input" id="mid-el-line" style="width:240px"><option>10 · Daily care cream 200 ml — demo</option><option>20 · Oral care floss 50 m — demo</option></select></label></div>
        <table class="m-tbl"><thead><tr><th class="r">Step</th><th>Condition</th><th>Description</th><th class="r">Base</th><th class="r">Rate</th><th class="r">Value</th><th>Bonus Buy</th></tr></thead><tbody>
          ${el0.map((r) => '<tr><td class="r num">' + r[0] + '</td><td class="num"><b>' + E(r[1]) + '</b></td><td>' + E(r[2]) + '</td><td class="r num">' + E(r[3]) + '</td><td class="r num">' + E(r[4]) + '</td><td class="r num' + (String(r[5]).startsWith('−') ? ' m-os pos' : '') + '">' + E(r[5]) + '</td><td>' + E(r[6] || 'No') + '</td></tr>')}
        </tbody></table>
      </section>`;

    const panels = '<div class="m-sim-body">' +
      '<div data-panel="items"' + (S.simTab === 'items' ? '' : ' hidden') + ' style="display:grid; gap:12px">' + items + '</div>' +
      '<div data-panel="results"' + (S.simTab === 'results' ? '' : ' hidden') + ' style="display:grid; gap:12px">' + results + '</div>' +
      '<div data-panel="promotions"' + (S.simTab === 'promotions' ? '' : ' hidden') + '>' + promos + '</div>' +
      '<div data-panel="elements"' + (S.simTab === 'elements' ? '' : ' hidden') + '>' + elements + '</div></div>';
    const footer = h`
      <div class="m-footer" role="toolbar" aria-label="Simulation actions">
        <span class="grow" id="mid-simstat"><span class="m-os pos">${I('check', 14)}</span>Calculated in ${s.totals.calcMs} ms · ${s.lines.length} lines · Promotion on</span>
        <button type="button" class="m-btn trans" data-act="toast" data-msg="The whole pricing cache was cleared">Clear Cache</button>
        <button type="button" class="m-btn" data-act="toast" data-msg="Basket cleared">Clear</button>
        <button type="button" class="m-btn emph" data-act="simulate">${I('play', 13)}Simulate <kbd>Ctrl+Enter</kbd></button>
      </div>`;
    mount.innerHTML = shell('POS Simulation', head + panels + footer);

    const stale = () => { const st = mount.querySelector('#mid-simstat'); if (st) st.innerHTML = '<span class="m-os crit">' + I('refresh', 14) + 'Inputs changed — simulate again</span>'; };
    const simulate = () => {
      const st = mount.querySelector('#mid-simstat');
      if (st) st.innerHTML = '<span class="m-os pos">' + I('check', 14) + '</span>Calculated in 198 ms · ' + s.lines.length + ' lines · Promotion on';
      toast(mount, 'Simulation complete in 198 ms');
    };
    mount.oninput = (e) => { if (e.target.matches('input, select')) stale(); };
    document.onkeydown = (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); simulate(); } };
    mount.onkeydown = (e) => { const tr = e.target.closest && e.target.closest('tr.m-line'); if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); tr.click(); } };
    mount.onclick = (e) => {
      closePops(mount, e);
      const t = e.target.closest('[data-act]');
      if (common(mount, e, t) || !t) return;
      const a = t.dataset.act;
      if (a === 'tab') {
        S.simTab = t.dataset.tab;
        mount.querySelectorAll('.m-itb [data-tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === S.simTab)));
        mount.querySelectorAll('[data-panel]').forEach((p) => { p.hidden = p.dataset.panel !== S.simTab; });
      }
      else if (a === 'line') { const pos = +t.dataset.pos; S.open[pos] = !S.open[pos]; RT.rerender(); }
      else if (a === 'expandall') { s.lines.forEach((l) => { S.open[l.pos] = true; }); RT.rerender(); }
      else if (a === 'simhead') { S.simHead = !S.simHead; RT.rerender(); }
      else if (a === 'sw') { t.setAttribute('aria-checked', String(t.getAttribute('aria-checked') !== 'true')); stale(); }
      else if (a === 'simulate') simulate();
      else if (a === 'toast') toast(mount, t.dataset.msg);
    };
  }

  /* ================= CALL CENTER (Flexible Column Layout) ================= */
  function renderCc(mount) {
    const h = RT.h, c = window.DATA.cc;
    const isDel = S.fulfil === 'Delivery';
    const r = c.receipt;
    const total = isDel ? r.total : +(r.total - r.delivery).toFixed(2);
    const atp = { pos: ['pos', 'check'], neg: ['neg', 'ban'], unk: ['crit', 'alert'] };
    const payOpts = isDel ? ['Cash on delivery', 'Paid online'] : ['Pay on collection', 'Paid online'];
    if (S.payment && !payOpts.includes(S.payment)) S.payment = '';
    const initials = c.caller.name.split(' ').map((x) => x[0]).join('').slice(0, 2);

    const begin = h`

            <span class="m-hint">Type the number the caller is ringing from.</span></div>
          <div>
            <div class="m-ohead"><span class="m-av" aria-hidden="true">${E(initials)}</span><div><h3>${E(c.caller.name)}</h3><div class="sub num">${E(c.caller.mobile)}</div></div></div>

              <dt>Email</dt><dd class="muted">—</dd>

            <button type="button" class="m-btn trans" style="margin-block-start:8px; margin-inline-start:-10px" data-act="toast" data-msg="Caller removed from the order">${I('x', 14)}Remove Caller</button>
          </div>
          <div>
            <div class="m-group-h">Open Requests <span class="cnt">(${c.requests})</span></div>
            <div class="m-li nav" data-act="toast" data-msg="Request 2000079912 opens in the OMS (new tab)" tabindex="0"><div class="grow"><div class="tt num">Request 2000079912</div><div class="ds">Raised at store 1101 · Sep 30</div></div>${os('info', '', 'Open')}${I('chevronRight', 14)}</div>
            <div class="m-li nav" data-act="toast" data-msg="Request 2000079640 opens in the OMS (new tab)" tabindex="0"><div class="grow"><div class="tt num">Request 2000079640</div><div class="ds">Raised at store 1204 · Sep 28</div></div>${os('info', '', 'Open')}${I('chevronRight', 14)}</div>
          </div>
          <div>
            <div class="m-group-h">${isDel ? 'Address' : 'Collecting From'}</div>
            ${isDel ? h`<div class="m-li">${I('home', 18)}<div class="grow"><div class="tt">${E(c.address.label)}</div><div class="ds">${E(c.address.line)} · ${E(c.address.district)} · ${E(c.address.city)}</div></div><button type="button" class="m-link" data-act="toast" data-msg="Address book opens">Change</button></div>`
              : h`<div class="m-li">${I('box', 18)}<div class="grow"><div class="tt">Store ${E(c.store)}</div><div class="ds">Their Home address is kept — switch back to delivery and it is used again.</div></div></div>`}
          </div>
        </div>
      </section>`;

    const settings = h`
      <div>
        <div class="m-group-h">Order Settings</div>
        <div class="m-form2" style="margin-block-start:10px">
          <div class="m-field"><span class="m-lab">Fulfilment</span><div class="m-seg" role="group" aria-label="Fulfilment">
            <button type="button" data-act="fulfil" data-v="Delivery" aria-pressed="${isDel}">Delivery</button><button type="button" data-act="fulfil" data-v="Collection" aria-pressed="${!isDel}">Collection</button></div></div>
          <div class="m-field"><label class="m-lab" for="mid-cc-store">${isDel ? 'Fulfilment Store' : 'Collection Store'}</label><div class="m-vh"><input class="m-input" id="mid-cc-store" value="${E(c.store)}">${I('search', 15)}</div>${isDel ? '<span class="m-hint">Derived from the caller\'s address</span>' : ''}</div>
          ${isDel ? h`<div class="m-field"><label class="m-lab req" for="mid-cc-slot">Delivery Slot</label><div class="m-vh"><input class="m-input" id="mid-cc-slot" value="Today 18:00–21:00">${I('calendar', 15)}</div></div>` : ''}
          <div class="m-field"><label class="m-lab req" for="mid-cc-src">Document Source</label><select class="m-input" id="mid-cc-src"><option>CALL CENTER</option><option>WEB</option></select></div>
          <div class="m-field"><label class="m-lab req" for="mid-cc-ref">Source Reference</label><input class="m-input" id="mid-cc-ref" value="CRM-889231"></div>
          <div class="m-field"><label class="m-lab req" for="mid-cc-pay">Payment</label>
            <select class="m-input${S.payment ? '' : ' err'}" id="mid-cc-pay" data-pay="1" aria-invalid="${!S.payment}" aria-describedby="mid-cc-pay-vs"><option value="">Choose how they pay…</option>${payOpts.map((o) => '<option' + (o === S.payment ? ' selected' : '') + '>' + E(o) + '</option>')}</select>
            ${S.payment ? '' : '<div class="m-vs err" id="mid-cc-pay-vs">Choose how the caller is paying.</div>'}</div>
          <div class="m-field"><label class="m-lab" for="mid-cc-coupon">Coupon</label>
            <div class="m-input warn" style="display:flex; align-items:center; gap:6px"><span class="m-token">SAVE20 ${I('x', 11)}</span><input id="mid-cc-coupon" style="border:0; background:transparent; outline:none; flex:1; min-width:0" placeholder="Read the code from the caller"></div>
            <div class="m-vs warn">SAVE20 is 20% off oral care — no oral care item in the basket yet.</div></div>
          <div class="m-field full"><label class="m-lab" for="mid-cc-note">Order Note</label><textarea class="m-input" id="mid-cc-note" placeholder="What the caller asked for"></textarea></div>
        </div>
      </div>`;

    const search = h`
      <div>
        <div class="m-group-h">Add Items</div>

        <p class="m-hint">Catalogue prices are estimates before VAT — the basket price is what the caller pays.</p>
