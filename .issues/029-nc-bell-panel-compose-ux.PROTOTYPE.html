<title>NC Bell / Panel / Compose — UX prototype (ticket 029)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* ------------------------------------------------------------------ *
   * THROWAWAY PROTOTYPE — wayfinder ticket 029 (map 023, Web BO NC).
   * Mirrors the real oms-react shell tokens (src/app/global.css) so the
   * look is honest. Vanilla HTML/JS, in-memory only. Not production.
   * ------------------------------------------------------------------ */
  :root {
    --background: oklch(0.991 0.003 92);
    --foreground: oklch(0.229 0.006 84);
    --card: oklch(1 0 0);
    --muted: oklch(0.962 0.005 92);
    --muted-foreground: oklch(0.538 0.009 84);
    --accent-bg: oklch(0.941 0.006 92);
    --border: oklch(0.915 0.006 92);
    --input: oklch(0.898 0.006 92);
    --primary: oklch(0.229 0.006 84);
    --primary-foreground: oklch(0.985 0.002 92);
    --ring: oklch(0.663 0.129 44);          /* terracotta — focus/active only */
    --sidebar: oklch(0.97 0.005 92);
    --destructive: oklch(0.577 0.245 27.325);
    --brand-gold: #FDC801;
    --brand-navy: #002554;
    --radius: 0.625rem;
    --shadow: 0 4px 24px -8px oklch(0.229 0.006 84 / 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: oklch(0.224 0.004 84);
      --foreground: oklch(0.953 0.004 92);
      --card: oklch(0.265 0.004 84);
      --muted: oklch(0.307 0.004 84);
      --muted-foreground: oklch(0.718 0.005 84);
      --accent-bg: oklch(0.307 0.004 84);
      --border: oklch(1 0 0 / 12%);
      --input: oklch(1 0 0 / 16%);
      --primary: oklch(0.953 0.004 92);
      --primary-foreground: oklch(0.224 0.004 84);
      --ring: oklch(0.714 0.113 44);
      --sidebar: oklch(0.191 0.004 84);
      --destructive: oklch(0.704 0.191 22.216);
      --shadow: 0 6px 30px -10px black;
    }
  }
  :root[data-theme="light"] {
    --background: oklch(0.991 0.003 92); --foreground: oklch(0.229 0.006 84);
    --card: oklch(1 0 0); --muted: oklch(0.962 0.005 92); --muted-foreground: oklch(0.538 0.009 84);
    --accent-bg: oklch(0.941 0.006 92); --border: oklch(0.915 0.006 92); --input: oklch(0.898 0.006 92);
    --primary: oklch(0.229 0.006 84); --primary-foreground: oklch(0.985 0.002 92);
    --ring: oklch(0.663 0.129 44); --sidebar: oklch(0.97 0.005 92); --shadow: 0 4px 24px -8px oklch(0.229 0.006 84 / 0.18);
  }
  :root[data-theme="dark"] {
    --background: oklch(0.224 0.004 84); --foreground: oklch(0.953 0.004 92);
    --card: oklch(0.265 0.004 84); --muted: oklch(0.307 0.004 84); --muted-foreground: oklch(0.718 0.005 84);
    --accent-bg: oklch(0.307 0.004 84); --border: oklch(1 0 0 / 12%); --input: oklch(1 0 0 / 16%);
    --primary: oklch(0.953 0.004 92); --primary-foreground: oklch(0.224 0.004 84);
    --ring: oklch(0.714 0.113 44); --sidebar: oklch(0.191 0.004 84); --shadow: 0 6px 30px -10px black;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--background); color: var(--foreground);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* ---- shell ---- */
  .shell { min-height: 100vh; display: flex; flex-direction: column; }
  header.topbar {
    position: sticky; top: 0; z-index: 40; height: 48px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid color-mix(in oklab, var(--border) 60%, transparent);
    background: var(--background); padding: 0 12px;
  }
  .iconbtn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border: 0; border-radius: 8px;
    background: transparent; color: var(--foreground);
  }
  .iconbtn:hover { background: var(--accent-bg); }
  .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; }
  .brandmark {
    width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
    background: var(--brand-navy); color: var(--brand-gold); font-weight: 800; font-size: 13px;
  }
  .brand-name { font-weight: 600; letter-spacing: -0.01em; }
  .spacer { flex: 1; }
  .pos-chip {
    display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
    border-radius: 999px; border: 1px solid var(--border); background: var(--card);
    font-size: 12px; color: var(--muted-foreground);
  }
  .pos-chip .dot { width: 6px; height: 6px; border-radius: 999px; background: oklch(0.72 0.15 150); }

  /* bell */
  .bell-wrap { position: relative; }
  .badge {
    position: absolute; top: 1px; inset-inline-end: 1px; min-width: 16px; height: 16px;
    padding: 0 4px; border-radius: 999px; background: var(--ring); color: white;
    font-size: 10px; font-weight: 700; display: grid; place-items: center;
    box-shadow: 0 0 0 2px var(--background); transition: transform .18s;
  }
  .badge.pop { transform: scale(1.35); }
  .badge.hidden { display: none; }

  /* account */
  .avatar {
    width: 28px; height: 28px; border-radius: 999px; background: var(--primary);
    color: var(--primary-foreground); display: grid; place-items: center;
    font-size: 12px; font-weight: 600;
  }
  .acct { display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; color: inherit; padding: 4px 8px; border-radius: 8px; }
  .acct:hover { background: var(--accent-bg); }

  /* body layout */
  .body { display: flex; flex: 1; }
  aside.side {
    width: 232px; flex-shrink: 0; background: var(--sidebar);
    border-inline-end: 1px solid color-mix(in oklab, var(--border) 60%, transparent);
    padding: 8px;
  }
  .nav-group-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-foreground); padding: 8px 12px 4px; }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; color: var(--foreground); text-decoration: none; font-size: 13px; }
  .nav-item:hover { background: color-mix(in oklab, var(--accent-bg) 60%, transparent); }
  .nav-item.active { background: var(--accent-bg); font-weight: 500; }
  .nav-item .ico { width: 15px; height: 15px; opacity: .8; }
  main.main { min-width: 0; flex: 1; padding: 20px 24px; }

  /* ---- notification panel (dropdown variant) ---- */
  .panel {
    position: absolute; top: calc(100% + 6px); inset-inline-end: 0; z-index: 50;
    width: 380px; max-height: 460px; display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .panel-head h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .link-btn { border: 0; background: transparent; color: var(--muted-foreground); font-size: 12px; padding: 4px 6px; border-radius: 6px; }
  .link-btn:hover:not(:disabled) { background: var(--accent-bg); color: var(--foreground); }
  .link-btn:disabled { opacity: .4; cursor: default; }
  .panel-list { overflow-y: auto; }

  /* a notification row (shared by panel + full page) */
  .n-row { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; padding: 12px 14px; border-bottom: 1px solid color-mix(in oklab, var(--border) 55%, transparent); cursor: pointer; }
  .n-row:last-child { border-bottom: 0; }
  .n-row:hover { background: color-mix(in oklab, var(--accent-bg) 45%, transparent); }
  .n-dot { width: 8px; height: 8px; border-radius: 999px; margin-top: 6px; background: var(--ring); }
  .n-row.read .n-dot { background: transparent; }
  .n-title { font-weight: 600; }
  .n-row.read .n-title { font-weight: 500; color: var(--muted-foreground); }
  .n-body { color: var(--muted-foreground); font-size: 13px; margin-top: 1px; }
  .n-row.read .n-body { opacity: .75; }
  .n-time { color: var(--muted-foreground); font-size: 11px; white-space: nowrap; }
  .n-kind { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 999px; margin-inline-start: 6px; vertical-align: 1px; }
  .n-kind.broadcast { background: color-mix(in oklab, var(--brand-gold) 26%, transparent); color: color-mix(in oklab, var(--brand-navy) 80%, var(--foreground)); }
  .n-kind.job { background: var(--muted); color: var(--muted-foreground); }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted-foreground); font-size: 13px; }

  /* full-page list variant */
  .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .page-head h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
  .list-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; max-width: 720px; }

  /* ---- compose screen ---- */
  .compose { max-width: 620px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field label { font-size: 12px; font-weight: 600; }
  .field .row { display: flex; justify-content: space-between; align-items: baseline; }
  .counter { font-size: 11px; color: var(--muted-foreground); }
  .counter.over { color: var(--destructive); }
  input[type=text], input[type=date], textarea, select {
    width: 100%; background: var(--background); color: var(--foreground);
    border: 1px solid var(--input); border-radius: 8px; padding: 8px 10px; font: inherit;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--ring); outline-offset: 1px; border-color: transparent; }
  textarea { resize: vertical; min-height: 88px; }
  .seg { display: inline-flex; padding: 3px; background: var(--muted); border-radius: 999px; gap: 2px; }
  .seg button { border: 0; background: transparent; color: var(--muted-foreground); padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; }
  .seg button.on { background: var(--card); color: var(--foreground); box-shadow: 0 1px 3px oklch(0 0 0 / .12); }
  .hint { font-size: 12px; color: var(--muted-foreground); }
  .pill-btn {
    display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px;
    background: var(--primary); color: var(--primary-foreground); padding: 9px 20px; font-weight: 600; font-size: 13px;
  }
  .pill-btn:disabled { opacity: .45; cursor: default; }
  .pill-btn.ghost { background: transparent; color: var(--foreground); border: 1px solid var(--border); }
  .fleet-warn { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--muted-foreground); background: color-mix(in oklab, var(--brand-gold) 14%, transparent); border: 1px solid color-mix(in oklab, var(--brand-gold) 40%, transparent); border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; }

  /* denied compose state */
  .denied { max-width: 520px; text-align: center; padding: 48px 24px; color: var(--muted-foreground); }
  .denied .lock { width: 44px; height: 44px; margin: 0 auto 12px; opacity: .5; }
  .denied h2 { color: var(--foreground); font-size: 17px; margin: 0 0 6px; }

  /* ---- sonner-style toasts ---- */
  .toaster { position: fixed; inset-block-end: 16px; inset-inline-end: 16px; z-index: 60; display: flex; flex-direction: column; gap: 10px; width: 356px; max-width: calc(100vw - 32px); }
  .toast {
    position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); padding: 12px 14px; overflow: hidden;
    animation: toast-in .28s cubic-bezier(.2,.7,.3,1);
  }
  .toast.out { animation: toast-out .22s ease forwards; }
  @keyframes toast-in { from { transform: translateY(10px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes toast-out { to { transform: translateX(20px); opacity: 0; } }
  .toast .t-head { display: flex; align-items: center; gap: 8px; }
  .toast .t-title { font-weight: 650; font-size: 13px; flex: 1; }
  .toast .t-body { color: var(--muted-foreground); font-size: 12.5px; margin-top: 3px; }
  .toast .t-close { border: 0; background: transparent; color: var(--muted-foreground); width: 22px; height: 22px; border-radius: 6px; line-height: 1; }
  .toast .t-close:hover { background: var(--accent-bg); }
  .toast .t-actions { margin-top: 10px; display: flex; gap: 8px; }
  .toast .t-actions button { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 5px 12px; border: 1px solid var(--border); background: transparent; color: var(--foreground); }
  .toast .t-actions button.primary { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
  .toast.banner { border-inline-start: 3px solid var(--brand-gold); }
  .toast .progress { position: absolute; inset-block-end: 0; inset-inline-start: 0; height: 2px; background: var(--ring); width: 100%; transform-origin: left; }
  @media (prefers-reduced-motion: reduce) { .toast, .badge { animation: none !important; transition: none !important; } }

  /* ---- control dock ---- */
  .dock {
    position: fixed; inset-block-end: 16px; inset-inline-start: 50%; transform: translateX(-50%);
    z-index: 70; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    box-shadow: var(--shadow); padding: 7px 10px; max-width: calc(100vw - 24px);
  }
  .dock .grp { display: inline-flex; align-items: center; gap: 4px; padding-inline-end: 6px; border-inline-end: 1px solid var(--border); }
  .dock .grp:last-child { border-inline-end: 0; padding-inline-end: 0; }
  .dock .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-foreground); margin-inline-end: 2px; }
  .dock button.tog { border: 1px solid var(--border); background: var(--background); color: var(--foreground); font-size: 12px; padding: 5px 11px; border-radius: 999px; }
  .dock button.tog.on { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
  .dock button.act { border: 1px solid var(--border); background: var(--background); color: var(--foreground); font-size: 12px; padding: 5px 11px; border-radius: 999px; }
  .dock button.act:hover { background: var(--accent-bg); }

  .modal-scrim { position: fixed; inset: 0; z-index: 80; background: oklch(0 0 0 / .5); display: grid; place-items: center; padding: 16px; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); width: 420px; max-width: 100%; padding: 20px; }
  .modal h3 { margin: 0 0 8px; font-size: 16px; }
  .modal p { margin: 0 0 16px; color: var(--muted-foreground); font-size: 13px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; }
  svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  svg.i.sm { width: 15px; height: 15px; }
</style>

<script>
(function () {
  // ---- state ------------------------------------------------------------
  const STORES = ['0142 · Olaya', '0207 · Tahlia', '0311 · Malqa', '0455 · Khobar Corniche'];
  const now = 1_700_000_000_000; // fixed clock (no Date.now for determinism)
  let seq = 100;
  function seed() {
    return [
      { id: 'n1', kind: 'BROADCAST', title: 'System maintenance tonight', body: 'SIS will be read-only 01:00–02:00 for the monthly price-file load. Plan around it.', ageMin: 4, read: false },
      { id: 'n2', kind: 'JOB_DONE', title: 'Coupon import finished', body: 'RAMADAN25 batch — 1,204 codes generated, 0 rejected.', ageMin: 22, read: false },
      { id: 'n3', kind: 'BROADCAST', title: 'New refund policy in effect', body: 'Effective today: refunds over SAR 500 require a supervisor PIN. See the ops bulletin.', ageMin: 90, read: false },
      { id: 'n4', kind: 'JOB_DONE', title: 'Nightly stock sync complete', body: 'All 312 open stores reconciled at 03:12.', ageMin: 60 * 20, read: true },
    ];
  }
  const state = {
    surface: 'panel',
    grant: 'granted',
    view: 'home',        // 'home' | 'compose'
    panelOpen: false,
    items: seed(),
  };

  // ---- helpers ----------------------------------------------------------
  const $ = (s, r = document) => r.querySelector(s);
  const relTime = (min) => min < 1 ? 'just now' : min < 60 ? `${min|0}m ago` : min < 60*24 ? `${(min/60)|0}h ago` : `${(min/1440)|0}d ago`;
  const unreadCount = () => state.items.filter(i => !i.read).length; // Active ∧ !IsRead (expiry omitted in mock)

  function bumpBadge() {
    const b = $('#badge'); const n = unreadCount();
    b.textContent = n; b.classList.toggle('hidden', n === 0);
    b.classList.add('pop'); setTimeout(() => b.classList.remove('pop'), 200);
  }

  function rowHtml(i) {
    const kindClass = i.kind === 'BROADCAST' ? 'broadcast' : 'job';
    const kindLabel = i.kind === 'BROADCAST' ? 'Broadcast' : 'Job';
    return `<div class="n-row ${i.read ? 'read' : ''}" data-id="${i.id}">
      <span class="n-dot"></span>
      <div>
        <div class="n-title">${i.title}<span class="n-kind ${kindClass}">${kindLabel}</span></div>
        <div class="n-body">${i.body}</div>
      </div>
      <span class="n-time tnum">${relTime(i.ageMin)}</span>
    </div>`;
  }

  function listInnerHtml() {
    if (!state.items.length) return `<div class="empty">You're all caught up.</div>`;
    return [...state.items].sort((a,b) => a.ageMin - b.ageMin).map(rowHtml).join('');
  }

  // ---- panel (dropdown variant) ----------------------------------------
  function renderPanel() {
    const mount = $('#panelMount');
    if (state.surface !== 'panel' || !state.panelOpen) { mount.innerHTML = ''; return; }
    const anyUnread = unreadCount() > 0;
    mount.innerHTML = `<div class="panel" role="dialog" aria-label="Notifications">
      <div class="panel-head">
        <h3>Notifications</h3>
        <button class="link-btn" id="markAll" ${anyUnread ? '' : 'disabled'}>Mark all as read</button>
      </div>
      <div class="panel-list">${listInnerHtml()}</div>
    </div>`;
    mount.querySelectorAll('.n-row').forEach(r => r.addEventListener('click', () => markRead(r.dataset.id)));
    const ma = $('#markAll'); if (ma) ma.addEventListener('click', markAllRead);
  }

  // ---- main content -----------------------------------------------------
  function renderMain() {
    const m = $('#main');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

    if (state.view === 'compose') { renderCompose(m); return; }

    // home: full-page list variant lives here; panel variant shows a placeholder home
    if (state.surface === 'page') {
      const anyUnread = unreadCount() > 0;
      m.innerHTML = `<div class="page-head">
          <h1>Notifications</h1>
          <button class="link-btn" id="markAllPage" ${anyUnread ? '' : 'disabled'} style="font-size:13px">Mark all as read</button>
        </div>
        <div class="list-card">${listInnerHtml()}</div>`;
      m.querySelectorAll('.n-row').forEach(r => r.addEventListener('click', () => markRead(r.dataset.id)));
      const ma = $('#markAllPage'); if (ma) ma.addEventListener('click', markAllRead);
    } else {
      m.innerHTML = `<div style="color:var(--muted-foreground);max-width:520px">
        <h1 style="color:var(--foreground);font-size:20px;margin:0 0 8px">Home</h1>
        <p>The bell opens a <strong>dropdown panel</strong> in this variant — click the 🔔 top-right.
        Flip the dock to <em>Full page</em> to see the alternative, where the bell routes here instead.</p></div>`;
    }
  }

  // ---- compose ----------------------------------------------------------
  function renderCompose(m) {
    $('#navBroadcast').classList.add('active');

    if (state.grant === 'denied') {
      // RECOMMENDED denied treatment: the nav item is hidden (see applyGrant),
      // and a direct hit on the route shows this soft gate. Server Create stays authoritative.
      m.innerHTML = `<div class="denied">
        <svg class="i lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <h2>You don't have access to Send Broadcast</h2>
        <p>Broadcasting to stores or the whole fleet needs the <strong>NotificationBroadcast</strong> grant.
        Ask an administrator to add it to your role.</p>
      </div>`;
      return;
    }

    const c = state._compose || (state._compose = { title: '', body: '', channel: 'all', store: STORES[0], expires: '' });
    m.innerHTML = `<div class="compose">
      <div class="page-head"><h1>Send Broadcast</h1></div>
      <div class="card">
        <div class="field">
          <div class="row"><label for="cTitle">Title</label><span class="counter" id="cTitleC">0 / 200</span></div>
          <input type="text" id="cTitle" maxlength="240" placeholder="Short headline everyone sees" value="${c.title}">
        </div>
        <div class="field">
          <div class="row"><label for="cBody">Message</label><span class="counter" id="cBodyC">0 / 1000</span></div>
          <textarea id="cBody" placeholder="What do you need people to know?">${c.body}</textarea>
        </div>
        <div class="field">
          <label>Send to</label>
          <div class="seg" role="tablist">
            <button data-ch="all" class="${c.channel==='all'?'on':''}">Whole fleet</button>
            <button data-ch="store" class="${c.channel==='store'?'on':''}">One store</button>
          </div>
          <div id="storeRow" style="display:${c.channel==='store'?'block':'none'};margin-top:4px">
            <select id="cStore">${STORES.map(s => `<option ${s===c.store?'selected':''}>${s}</option>`).join('')}</select>
          </div>
        </div>
        <div class="field">
          <label for="cExp">Expires <span class="hint">(optional — blank keeps it visible for 30 days)</span></label>
          <input type="date" id="cExp" value="${c.expires}">
        </div>
        <div id="fleetWarn" class="fleet-warn" style="display:${c.channel==='all'?'flex':'none'}">
          <svg class="i sm" viewBox="0 0 24 24" style="flex-shrink:0;margin-top:1px"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
          <span>This reaches <strong>every open store and back-office user</strong>. You'll be asked to confirm before it sends.</span>
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <button class="pill-btn" id="sendBtn" disabled><svg class="i sm" viewBox="0 0 24 24"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>Send broadcast</button>
          <span class="hint" id="sendHint">Title and message are required.</span>
        </div>
      </div>
    </div>`;

    const cTitle = $('#cTitle'), cBody = $('#cBody'), cExp = $('#cExp');
    const cTitleC = $('#cTitleC'), cBodyC = $('#cBodyC'), sendBtn = $('#sendBtn'), sendHint = $('#sendHint');
    function refresh() {
      c.title = cTitle.value; c.body = cBody.value; c.expires = cExp.value;
      const tl = c.title.length, bl = c.body.length;
      cTitleC.textContent = `${tl} / 200`; cTitleC.classList.toggle('over', tl > 200);
      cBodyC.textContent = `${bl} / 1000`; cBodyC.classList.toggle('over', bl > 1000);
      const ok = tl > 0 && tl <= 200 && bl > 0 && bl <= 1000;
      sendBtn.disabled = !ok;
      sendHint.textContent = !c.title || !c.body ? 'Title and message are required.'
        : (tl > 200 || bl > 1000) ? 'Trim the text to fit the limits.' : 'Ready to send.';
    }
    cTitle.addEventListener('input', refresh); cBody.addEventListener('input', refresh); cExp.addEventListener('change', refresh);
    refresh();
    m.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
      c.channel = b.dataset.ch; renderCompose(m);
    }));
    const cs = $('#cStore'); if (cs) cs.addEventListener('change', () => c.store = cs.value);
    sendBtn.addEventListener('click', () => attemptSend(c));
  }

  function attemptSend(c) {
    if (c.channel === 'all') { confirmFleet(c); return; }
    doSend(c);
  }
  function confirmFleet(c) {
    const scrim = document.createElement('div');
    scrim.className = 'modal-scrim';
    scrim.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
      <h3>Send to the whole fleet?</h3>
      <p>“${c.title || 'Untitled'}” will reach every open store and back-office user immediately. This can't be recalled.</p>
      <div class="actions">
        <button class="pill-btn ghost" id="mCancel">Cancel</button>
        <button class="pill-btn" id="mGo">Send to everyone</button>
      </div>
    </div>`;
    document.body.appendChild(scrim);
    $('#mCancel', scrim).addEventListener('click', () => scrim.remove());
    scrim.addEventListener('click', e => { if (e.target === scrim) scrim.remove(); });
    $('#mGo', scrim).addEventListener('click', () => { scrim.remove(); doSend(c); });
  }
  function doSend(c) {
    const where = c.channel === 'all' ? 'the whole fleet' : c.store;
    pushToast({ kind: 'SUCCESS', title: 'Broadcast sent', body: `Delivered to ${where}.` });
    state._compose = { title: '', body: '', channel: 'all', store: STORES[0], expires: '' };
    renderMain();
  }

  // ---- read actions -----------------------------------------------------
  function markRead(id) {
    const it = state.items.find(i => i.id === id);
    if (it && !it.read) { it.read = true; rerender(); } // optimistic; server Read fires per-id
  }
  function markAllRead() { state.items.forEach(i => i.read = true); rerender(); } // per-id loop (no bulk endpoint)

  // ---- arrivals (sonner) ------------------------------------------------
  function pushToast(t) {
    const el = document.createElement('div');
    const isBanner = t.kind === 'BROADCAST';
    el.className = 'toast' + (isBanner ? ' banner' : '');
    const icon = t.kind === 'SUCCESS'
      ? '<svg class="i sm" viewBox="0 0 24 24" style="color:oklch(0.6 0.15 150)"><path d="M20 6 9 17l-5-5"/></svg>'
      : isBanner
        ? '<svg class="i sm" viewBox="0 0 24 24" style="color:var(--brand-navy)"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>'
        : '<svg class="i sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>';
    el.innerHTML = `<div class="t-head">${icon}<span class="t-title">${t.title}</span>
      <button class="t-close" aria-label="Dismiss">&times;</button></div>
      ${t.body ? `<div class="t-body">${t.body}</div>` : ''}
      ${isBanner ? `<div class="t-actions"><button class="primary" data-act="view">View</button><button data-act="dismiss">Dismiss</button></div>` : ''}
      ${isBanner ? '' : '<div class="progress" id="pg"></div>'}`;
    $('#toaster').prepend(el);
    const remove = () => { el.classList.add('out'); setTimeout(() => el.remove(), 220); };
    $('.t-close', el).addEventListener('click', remove);
    el.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
      if (b.dataset.act === 'view') { openPanelOrPage(); }
      remove();
    }));
    if (!isBanner) { // Toast style auto-dismisses ~8s with a progress bar
      const pg = $('#pg', el);
      pg.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: 8000, easing: 'linear' });
      setTimeout(remove, 8000);
    }
  }

  function openPanelOrPage() {
    if (state.surface === 'page') { state.view = 'home'; renderMain(); }
    else { state.panelOpen = true; renderPanel(); }
  }

  function arrive(kind) {
    seq++;
    const item = kind === 'BROADCAST'
      ? { id: 'n' + seq, kind, title: 'Urgent: card terminals rebooting', body: 'Payment terminals fleet-wide will reboot in 10 minutes. Finish open sales.', ageMin: 0, read: false }
      : { id: 'n' + seq, kind, title: 'Bonus-buy download ready', body: 'BBY export for region West completed — 48 promotions.', ageMin: 0, read: false };
    state.items.unshift(item);
    bumpBadge();                         // badge bumps in lock-step with the toast
    renderPanel(); renderMain();
    pushToast(item);                     // 15-min freshness gate ⇒ only fresh (ageMin 0) items toast
  }

  // ---- render orchestration ---------------------------------------------
  function rerender() { bumpBadge(); renderPanel(); renderMain(); }

  function applyGrant() {
    // RECOMMENDED: hide the nav item entirely when the grant is absent (permission-aware nav,
    // same pattern as the rest of the portal). The soft gate on the route is the backstop.
    $('#navBroadcast').style.display = state.grant === 'denied' ? 'none' : '';
    if (state.grant === 'denied' && state.view === 'compose') { /* keep showing soft gate */ }
  }

  // ---- wiring -----------------------------------------------------------
  $('#bellBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    if (state.surface === 'page') { state.view = 'home'; state.panelOpen = false; renderMain(); }
    else { state.panelOpen = !state.panelOpen; renderPanel(); }
  });
  document.addEventListener('click', (e) => {
    if (state.panelOpen && !e.target.closest('.panel') && !e.target.closest('#bellBtn')) {
      state.panelOpen = false; renderPanel();
    }
  });
  $('#navBroadcast').addEventListener('click', (e) => { e.preventDefault(); state.view = 'compose'; state.panelOpen = false; renderPanel(); renderMain(); });
  $('.brand').addEventListener('click', (e) => { e.preventDefault(); state.view = 'home'; renderMain(); });

  $('#simBroadcast').addEventListener('click', () => arrive('BROADCAST'));
  $('#simJob').addEventListener('click', () => arrive('JOB_DONE'));
  $('#resetBtn').addEventListener('click', () => { state.items = seed(); state._compose = null; state.view = 'home'; state.panelOpen = false; rerender(); });

  document.querySelectorAll('.dock .tog').forEach(btn => btn.addEventListener('click', () => {
    const q = btn.dataset.q, v = btn.dataset.v;
    document.querySelectorAll(`.dock .tog[data-q="${q}"]`).forEach(b => b.classList.toggle('on', b === btn));
    state[q] = v;
    if (q === 'grant') applyGrant();
    if (q === 'surface') state.panelOpen = false;
    renderPanel(); renderMain();
  }));

  // theme toggle
  $('#themeBtn').addEventListener('click', () => {
    const root = document.documentElement;
    const cur = root.getAttribute('data-theme')
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  });

  // ---- boot -------------------------------------------------------------
  applyGrant(); bumpBadge(); renderMain();
})();
</script>
