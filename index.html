<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OMS Portal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Mobile browser chrome. These must track `--background` in global.css
         (light #F2F4F8 / dark #0A111D, palette B — spec 380 F2, 362 §1) but cannot read it:
         a meta tag has no access to CSS custom properties. They are the only
         colour literals outside `global.css` and the logo SVG, and they live
         outside `src/`, which is what D-12's gates scan. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F4F8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A111D" />
    <script>
      // Apply theme before first paint — stored choice, else OS preference.
      try {
        var stored = localStorage.getItem('oms.darkMode')
        var dark = stored !== null ? stored === 'true' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
        // AG Grid reads its theme variant from this attribute on any grid ancestor —
        // set pre-paint too, so the grid never flashes light before going dark.
        document.documentElement.dataset.agThemeMode = dark ? 'dark' : 'light'
      } catch (e) {}
      // Direction is a boot fact (spec 380 F22): set from the stored locale before first
      // paint, read once by src/core/theme/direction.ts. AG Grid's enableRtl cannot change
      // on a mounted grid, so a language switch writes `oms.locale` and reloads. With no
      // stored locale the page is LTR. Only `dir` is set: `lang` stays the markup's "en"
      // while i18n renders English (src/core/i18n.ts), so the two never disagree.
      try {
        var locale = localStorage.getItem('oms.locale')
        if (locale) document.documentElement.dir = locale.split('-')[0] === 'ar' ? 'rtl' : 'ltr'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
