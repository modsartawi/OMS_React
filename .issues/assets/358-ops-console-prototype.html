      </div>`;

    const basket = h`
      <div>
        <div class="m-group-h">Basket <span class="cnt">(${c.basket.length})</span><span class="sp"></span><span class="m-hint" style="font-weight:400">Prices include VAT</span></div>
        <table class="m-tbl"><thead><tr><th>Item</th><th>At Add</th><th>Quantity</th><th>UoM</th><th class="r">Total</th><th></th></tr></thead><tbody>
        ${c.basket.map((b) => '<tr><td><div>' + E(b.title) + '</div><span class="sub num">' + E(b.item) + ' · ' + M(b.unit) + ' each</span>' +
          (b.offer ? '<div style="margin-block-start:3px">' + os('pos', 'tag', b.offer.id + ' · ' + b.offer.desc) + ' <span class="m-os pos num">' + neg(b.offer.amt) + ' SAR</span></div>' : '') +
          '</td><td><span class="muted">' + E(b.atp) + '</span></td><td><span class="m-qty"><button type="button" aria-label="Decrease" data-act="toast" data-msg="Quantity updated">' + I('minus', 12) + '</button><span class="num">' + b.qty + '</span><button type="button" aria-label="Increase" data-act="toast" data-msg="Quantity updated">' + I('plus', 12) + '</button></span></td><td>' + E(b.uom) +
          '</td><td class="r"><b class="num">' + M(b.total) + '</b><span class="unit">SAR</span></td><td class="r"><button type="button" class="m-btn trans icon" aria-label="Void line" data-act="toast" data-msg="Line voided">' + I('trash', 15) + '</button></td></tr>')}
        </tbody></table>
      </div>`;

    const reach = c.offers.find((o) => o.state === 'reach');
    const counted = c.offers.find((o) => o.state === 'counted');
    const blocked = c.offers.find((o) => o.state === 'blocked');
    const offers = h`
      <div>
        <div class="m-group-h">Offers Within Reach <span class="cnt">(1)</span></div>
        <p class="m-hint" style="margin-block:6px 8px">Buy-one-get-one offers aren't checked yet — this list covers discounts only.</p>
        <div style="display:grid; gap:8px">
          <div class="m-offer reach">
            <div class="m-offer-h">${I('tag', 16)}<h4>${E(reach.head)} — ${E(reach.desc)} <span class="muted num" style="font-weight:400">${E(reach.id)}</span></h4>${os('info', '', 'Within reach')}</div>
            <div class="m-prog" style="margin:0"><span class="bar" role="progressbar" aria-valuenow="${reach.have}" aria-valuemin="0" aria-valuemax="${reach.need}" aria-label="Offer progress"><i style="width:${reach.have / reach.need * 100}%"></i></span><b style="color:var(--text)">${reach.have} of ${reach.need}</b> · add 1 more · ${E(reach.set)}</div>
            <div><button type="button" class="m-link" data-act="offer" aria-expanded="${S.offerOpen}">${S.offerOpen ? 'Hide Items' : 'Show Items'}</button></div>
            ${S.offerOpen ? '<div class="m-picks">' + reach.picks.map((p) => '<div class="m-li"><div class="grow"><div class="tt">' + E(p.title) + '</div><div class="ds num">' + E(p.item) + ' · ≈ ' + M(p.est) + ' SAR</div></div>' + os('pos', 'check', p.atp + ' in stock') + '<button type="button" class="m-btn" data-act="toast" data-msg="Added — this offer applied.">' + I('plus', 14) + 'Add</button></div>').join('') + '</div>' : ''}
          </div>
          <div class="m-offer"><div class="m-offer-h">${I('check', 16)}<h4>${E(counted.head)} — ${E(counted.desc)} <span class="muted num" style="font-weight:400">${E(counted.id)}</span></h4>${os('pos', '', 'Already counted')}</div></div>
          <div class="m-offer"><div class="m-offer-h">${I('ban', 16)}<h4>${E(blocked.head)} — ${E(blocked.desc)}</h4>${os('neu', '', "Can't be reached")}</div><div class="m-hint">${E(blocked.reason)}</div></div>
        </div>
      </div>`;

    const mid = h`
      <section class="m-col" aria-label="New order">
        <div class="m-col-title"><div class="t"><h2>New Order</h2><div class="sub">Document type ${E(c.docType)} · Operator ${E(c.operator)}</div></div>
          ${os('info', 'gift', '1 offer within reach', true)}
          <button type="button" class="m-btn trans icon" data-act="toast" data-msg="Order refreshed" aria-label="Refresh this order">${I('refresh', 15)}</button>
          <button type="button" class="m-btn neg" data-act="toast" data-msg="Abandon this order? Keep it / Abandon it">Abandon Order</button></div>
        <div class="m-col-body">${settings}${search}${basket}${offers}</div>
      </section>`;

    const end = h`
      <section class="m-col" aria-label="Summary">
        <div class="m-col-title"><div class="t"><h2>The Caller Pays</h2><div class="sub">Prices include VAT</div></div></div>
        <div class="m-col-body">
          ${S.placed ? h`<div class="m-placed">${os('pos', 'check', 'Order Placed')}<div class="m-lab" style="margin-block-start:10px">Order Number</div><div class="no num">1000081377</div><p class="muted">Read this number to the caller.</p></div>` : h`
          <div class="m-receipt">
            <div><span class="l">Items</span><span class="num">${M(r.items)} SAR</span></div>
            <div><span class="l">VAT</span><span class="num">${M(r.vat)} SAR</span></div>
            ${isDel ? h`<div style="flex-wrap:wrap"><span class="l">Delivery</span><span class="num">${M(r.delivery)} SAR</span><span class="m-hint" style="flex-basis:100%">Delivery is free over ${M(r.freeOver)} SAR.</span></div>` : ''}
            <div class="total"><span class="l">Total</span><span class="v num">${M(total)}<span class="unit">SAR</span></span></div>
          </div>
          ${S.payment ? h`<div class="m-ms pos">${I('check', 16)}<span class="grow">Ready to place · ${E(S.payment)}</span></div>` : h`<div class="m-ms warn" role="status">${I('alert', 16)}<span class="grow"><b>Needed first:</b> choose a payment type</span></div>`}`}
        </div>
        <div class="m-col-foot">
          ${S.placed ? '<button type="button" class="m-btn emph wide" data-act="next">Start the Next Order</button>'
            : '<button type="button" class="m-btn emph wide" data-act="place"' + (S.payment ? '' : ' disabled') + '>Place Order</button>'}
        </div>
      </section>`;

    const sep = (dir) => '<div class="m-col-sep"><button type="button" data-act="toast" data-msg="Columns: 25 / 50 / 25 — drag to resize" aria-label="Resize columns">' + I(dir, 14) + '</button></div>';
    mount.innerHTML = shell('Call Center Console', '<div class="m-fcl">' + begin + sep('chevronLeft') + mid + sep('chevronRight') + end + '</div>');

    mount.onchange = (e) => { if (e.target.dataset && e.target.dataset.pay) { S.payment = e.target.value; RT.rerender(); } };
    mount.onkeydown = (e) => { const li = e.target.closest && e.target.closest('.m-li.nav'); if (li && e.key === 'Enter') li.click(); };
    mount.onclick = (e) => {
      closePops(mount, e);
      const t = e.target.closest('[data-act]');
      if (common(mount, e, t) || !t) return;
      const a = t.dataset.act;
      if (a === 'fulfil') { S.fulfil = t.dataset.v; RT.rerender(); }
      else if (a === 'offer') { S.offerOpen = !S.offerOpen; RT.rerender(); }
      else if (a === 'place') { if (S.payment) { S.placed = true; RT.rerender(); } }
      else if (a === 'next') { S.placed = false; S.payment = ''; RT.rerender(); }
      else if (a === 'toast') toast(mount, t.dataset.msg);
    };
  }

  window.DIRS.mid = {
    tag: 'Mid',
    label: 'Fiori Horizon-style',
    render(screen, mount, ctx) {
      RT = ctx;
      if (screen === 'list') renderList(mount);
      else if (screen === 'details') renderDetails(mount);
      else if (screen === 'sim') renderSim(mount);
      else renderCc(mount);
    },
    notes: {
      direction: {
        idea: "Adopt the Fiori Horizon floorplans and visual grammar — List Report, Object Page, Dynamic Page, Flexible Column Layout — so BackOffice reads like the SAP screens operators already know, without being SAP.",
        system: [
          'New shared floorplan components in core/ui, none of which exist today: DynamicPage (title + collapsible header), FilterBar with variant management, ObjectPage with an anchor bar, FlexibleColumnLayout, MessageStrip and ObjectStatus.',
          'A Horizon-like token set replaces steel: brand blue #0070F2 on a grey page ground with white headers. Semantic families map onto Fiori states, plus indication colours for prescription (teal) and cancellation request (indigo).',
          'Density moves from the agreed 28px rows and 32px fields to Fiori compact 32px rows and 26px controls: fewer rows on screen for Screen 1\'s 41 columns.',
          "Type moves to Noto Sans as a stand-in for SAP's 72 face, which is not freely licensed for the web. Noto Sans Arabic covers the planned RTL locale.",
          'Risk: it looks like SAP without SAP behaviour (personalisation, value help, shared variants, draft handling), and SAP-trained users will expect them.',
        ],
      },
      list: {
        retheme: 'Medium', rebuild: 'Medium',
        changes: [
          "FilterPanel's 14-field grid becomes a filter bar with 5 visible fields, Go, and an Adapt Filters dialog that chooses which fields show.",
          "ViewManager's \"Saved views\" select becomes the page-title variant selector, with an asterisk when the filters are modified.",
          'Status moves from filled pills to ObjectStatus (coloured text + icon). Rows with failed jobs or a cancellation request get a highlight bar at the row start instead of a red Failed Jobs cell.',
          'A checkbox column and a navigation chevron column open the delivery. Open / Export / table settings live in the table toolbar.',
        ],
        keeps: [
          'All 14 production criteria and the buildDeliveryQuery semantics. Hidden filters still apply.',
          'AG Grid Community with sort, column filters, the pinned Delivery No column and native Ctrl+C text copy.',
          'Column chooser and export, moved behind the toolbar gear.',
        ],
        risks: [
          '32px rows show about 12% fewer rows than today\'s 28px on the same screen.',
          'ObjectStatus text is less glanceable at scale than today\'s filled pills.',
          'SAP users expect variant management to support default, shared and apply-automatically views. ViewManager does less than that today.',
        ],
      },
      details: {
        retheme: 'Medium', rebuild: 'Large',
        changes: [
          'IdentityBand and StatusRail merge into an Object Page header: title, key fields, Status facet, Amount Due KPI and inverted tags (Dawaa Now, Overall, Prescription).',
          "CommandPanel's clusters become a header toolbar. Destructive commands (Cancel Order, Force Cancel) move into the overflow menu.",
          'The tabbed work area becomes one scrolling page with a sticky anchor bar: General Information, Prescription, Items, Pricing Conditions, Processing Log, Jobs.',
          'A failed job surfaces as a negative message strip in the header, not only as a red Jobs tab badge.',
        ],
        keeps: [
          'Every SummaryRail field, regrouped as four form groups.',
          'Items grid with pinned totals and struck-through deleted lines. Disabled-command reasons as tooltips.',
          'All five grids (Items, Conditions, Log, Jobs) stay AG Grid.',
        ],
        risks: [
          'One long page scrolls more than today\'s tabs on big documents, because the log and jobs can be long.',
          'Command family colours (fulfilment green, cancel-request indigo) are lost in Fiori\'s emphasized / default / negative button set.',
          'Needs a new anchor bar + scrollspy component and an overflow-menu pattern.',
        ],
      },
      sim: {
        retheme: 'Medium', rebuild: 'Medium',
        changes: [
          "SimRunStrip's chips become a collapsible Dynamic Page header with a run form and KPI tiles. The collapsed header shows a one-line summary.",
          'Results, Items, Promotions and Pricing Elements become Icon Tab Bar tabs instead of the 66/34 results/promotions split.',
          'Process becomes Simulate in a floating footer toolbar (Ctrl+Enter kept). A line that did not price raises a warning message strip.',
        ],
        keeps: [
          'Every run input: plant, date, org, channel, procedure key, loyalty group and tier, Promotion, Pricing Elements.',
          'Expandable result line with the money foot and applied pricing rules. The buy → get block and the near-miss meter.',
          'Plain tables, with no AG Grid on this screen, as today.',
        ],
        risks: [
          'Splitting results and promotions into tabs loses the side-by-side cross-highlight between a line and the promotion that priced it.',
          'The header form takes about 180px of height until it is collapsed.',
        ],
      },
      cc: {
        retheme: 'Medium', rebuild: 'Large',
        changes: [
          'The three fixed columns become a Flexible Column Layout (Caller / New Order / Summary) with resize handles.',
          'The header chip row becomes a classic form with value-help fields and value states. Payment shows as an error until it is chosen; the coupon shows a warning.',
          'Offers within reach move from the docked strip into a list with progress indicators. The receipt becomes an object list with Place Order in the summary column footer.',
        ],
        keeps: [
          'Caller attach by mobile, open requests, address → derived store, Delivery / Collection switch.',
          'Item search with three-state availability and the Arabic name. Basket lines with their offer and availability frozen at add.',
          'The blockers named before Place Order, and the placed-order number to read back to the caller.',
        ],
        risks: [
          'The chip row is faster for an agent mid-call than an 8-field form.',
          'Flexible Column Layout is built for list → detail drill-down, not a single working order, so this borrows its look more than its behaviour.',
          'Keyboard-first flows (Ctrl+K palette, /store) are not a Fiori pattern and would have to be added back.',
        ],
      },
    },
  };
})();

</script>
<script>
/* FAR — "Ops Console": keyboard-first, dense, own identity. Registers window.DIRS.far. */
(function () {
  'use strict';
  window.DIRS = window.DIRS || {};

  let C = null;   // ctx of the current render
  let M = null;   // mount of the current render
  const S = {
    view: 'all',
    tokens: [{ k: 'date', v: '2026-10-01 → 2026-10-03' }, { k: 'delivery type', v: 'Delivery' }, { k: 'limit', v: '200' }],
    menu: false, selNo: null, focusTok: -1,
    pal: false, palIdx: 0,
    more: false, notes: [],
    simLine: 10, simStale: false, simRunning: false, promoOn: true, elemOn: true, simItems: null, tier: '',
    cc: null, tt: 0,
  };

  const GRID_PARAMS = { fontFamily: "'IBM Plex Sans', system-ui, sans-serif", fontSize: 12.5, headerFontSize: 11.5, headerFontWeight: 500, spacing: 4, wrapperBorderRadius: 0, wrapperBorder: false };
  const ST = { 'Ready': 'neutral', 'Delivered': 'ok', 'Cancelled': 'bad', 'Cancellation requested': 'indigo', 'Out for delivery': 'info' };
  const esc = (s) => C.esc(s);
  const ic = (n, s) => C.icon(n, s || 15);
  const money = (v) => C.money(v);
  const st = (s) => '<span class="f-st f-st-' + (ST[s] || 'neutral') + '"><i></i>' + esc(s) + '</span>';
  const kbd = (k) => '<kbd>' + k + '</kbd>';
  const isTyping = (t) => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);

  function toast(msg) {
    const el = M && M.querySelector('#f-toast');
    if (!el) return;
    el.textContent = msg; el.hidden = false;
    clearTimeout(S.tt); S.tt = setTimeout(() => { el.hidden = true; }, 2400);
  }

  /* ---------------- shell ---------------- */
  const RAIL = [
    { go: 'list', ic: 'truck', label: 'Deliveries' },
    { go: 'details', ic: 'file', label: 'Documents' },
    { go: 'sim', ic: 'tag', label: 'POS simulation' },
    { go: 'cc', ic: 'headset', label: 'Call center' },
    { go: null, ic: 'wallet', label: 'Collection' },
    { go: null, ic: 'layers', label: 'Reports' },
    { go: null, ic: 'settings', label: 'Admin' },
  ];
  const CRUMB = {
    list: ['OMS', 'Delivery documents'],
    details: ['OMS', 'Delivery documents', '8000048'],
    sim: ['Pricing', 'POS simulation'],
    cc: ['Call center', 'New order'],
  };
  function shell(screen, body) {
    const active = screen === 'details' ? 'details' : screen;
    const crumbs = CRUMB[screen];
    return '<div class="f-shell">' +
      '<nav class="f-rail" aria-label="Main">' +
        '<div class="f-mark" aria-hidden="true">ad</div>' +
        RAIL.map((r) => '<button type="button" class="f-rail-btn"' + (r.go ? ' data-go="' + r.go + '"' : ' data-act="soon" data-label="' + r.label + '"') +
          (r.go === active ? ' aria-current="page"' : '') + ' aria-label="' + r.label + '" title="' + r.label + '">' + ic(r.ic, 18) + '</button>').join('') +
        '<div class="f-rail-sp"></div><div class="f-me" title="Operator cc.agent07">OP</div>' +
      '</nav>' +
      '<div class="f-main">' +
        '<header class="f-top">' +
          '<div class="f-crumb">' + crumbs.map((c, i) => i === crumbs.length - 1 ? '<b class="' + (/^\d+$/.test(c) ? 'm' : '') + '">' + esc(c) + '</b>' : '<span>' + esc(c) + '</span><span aria-hidden="true">/</span>').join('') + '</div>' +
          '<button type="button" class="f-cmd" data-act="pal-open">' + ic('search', 15) + '<span>Search deliveries, documents, customers — or type a command</span>' + kbd('Ctrl') + '<kbd class="k-gold">K</kbd></button>' +
          '<div class="f-top-r"><span class="f-ctx">' + ic('map', 13) + 'Store <b class="m">P019</b></span>' +
            '<button type="button" class="f-ibtn" aria-label="Notifications" data-act="soon" data-label="Notifications">' + ic('bell', 16) + '</button></div>' +
        '</header>' +
        '<div class="f-body">' + body + '</div>' +
      '</div>' +
      '<div class="f-pal" id="f-pal" hidden><div class="f-pal-back" data-act="pal-close"></div>' +
        '<div class="f-pal-box" role="dialog" aria-modal="true" aria-label="Command palette">' +
          '<div class="f-pal-in">' + ic('command', 16) + '<input id="f-pal-input" autocomplete="off" spellcheck="false" placeholder="Type a command, delivery no., customer or mobile" aria-controls="f-pal-list">' + kbd('Esc') + '</div>' +
          '<div class="f-pal-list" id="f-pal-list" role="listbox"></div>' +
          '<div class="f-pal-foot"><span>' + kbd('↑') + kbd('↓') + ' move</span><span>' + kbd('↵') + ' run</span><span>' + kbd('Esc') + ' close</span></div>' +
        '</div></div>' +
      '<div class="f-toast" id="f-toast" role="status" hidden></div>' +
    '</div>';
  }

  /* ---------------- command palette ---------------- */
  function palItems(q) {
    q = (q || '').trim().toLowerCase();
    const has = (s) => !q || s.toLowerCase().includes(q);
    const out = [];
    [
      { g: 'Go to', l: 'Delivery documents', s: 'OMS', ic: 'truck', run: () => C.go('list') },
      { g: 'Go to', l: 'Delivery 8000048', s: 'Record', ic: 'file', run: () => C.go('details') },
      { g: 'Go to', l: 'POS simulation', s: 'Pricing', ic: 'tag', run: () => C.go('sim') },
      { g: 'Go to', l: 'Call center console', s: 'New order', ic: 'headset', run: () => C.go('cc') },
      { g: 'Actions', l: 'Reschedule 8000048', s: 'R', ic: 'calendar', run: () => toast('Reschedule 8000048 — the form opens here (preview only)') },
      { g: 'Actions', l: 'Request cancellation for 8000048', s: 'C', ic: 'ban', run: () => toast('Request cancellation — pick a reason (preview only)') },
      { g: 'Actions', l: 'Export current view', s: 'CSV', ic: 'download', run: () => toast('Export — 36 rows (preview only)') },
      { g: 'Actions', l: 'Run simulation', s: 'Ctrl ↵', ic: 'play', run: () => C.go('sim') },
      { g: 'Actions', l: 'Toggle dark theme', s: 'Theme', ic: 'moon', run: () => { const b = document.querySelector('[data-theme-btn="' + (document.documentElement.getAttribute('data-ag-theme-mode') === 'dark' ? 'light' : 'dark') + '"]'); if (b) b.click(); } },
    ].forEach((x) => { if (has(x.l) || has(x.g)) out.push(x); });
    const ds = window.DATA.deliveries.filter((d) => !q || [d.deliveryNo, d.customer, d.mobile, d.orderNo, d.documentNo].some((v) => v.toLowerCase().includes(q))).slice(0, q ? 8 : 5);
    ds.forEach((d) => out.push({ g: 'Deliveries', l: d.deliveryNo + '  ·  ' + d.customer, s: d.status, ic: 'box', mono: true,
      run: () => { S.selNo = d.deliveryNo; C.state.sel = d.deliveryNo; C.go('list'); } }));
    return out;
  }
  function palRender() {
    const input = M.querySelector('#f-pal-input');
    const list = M.querySelector('#f-pal-list');
    if (!input || !list) return;
    const items = palItems(input.value);
    S.palItems = items;
    if (S.palIdx >= items.length) S.palIdx = Math.max(0, items.length - 1);
    let g = '', html = '';
    items.forEach((x, i) => {
      if (x.g !== g) { g = x.g; html += '<div class="f-pal-g">' + esc(g) + '</div>'; }
      html += '<button type="button" class="f-pal-i" role="option" data-act="pal-run" data-i="' + i + '" aria-selected="' + (i === S.palIdx) + '">' + ic(x.ic, 15) +
        '<span class="l' + (x.mono ? ' m' : '') + '">' + esc(x.l) + '</span><span class="s">' + esc(x.s) + '</span></button>';
    });
    list.innerHTML = html || '<div class="f-pal-empty">Nothing matches “' + esc(input.value) + '”.</div>';
    const cur = list.querySelector('[aria-selected="true"]');
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  }
  function palOpen() {
    const p = M.querySelector('#f-pal'); if (!p) return;
    S.pal = true; S.palIdx = 0; p.hidden = false;
    const input = M.querySelector('#f-pal-input'); input.value = ''; palRender(); input.focus();
  }
  function palClose() { const p = M && M.querySelector('#f-pal'); S.pal = false; if (p) p.hidden = true; }
  function palRun(i) { const x = (S.palItems || [])[i]; palClose(); if (x) x.run(); }

  /* ---------------- list ---------------- */
  const CRITERIA = [
    ['From Date', 'date'], ['To Date', 'date'], ['Store Code', 'store code'], ['Delivery No', 'delivery no'], ['Customer Phone', 'customer phone'],
    ['Document No', 'document no'], ['Order No', 'order no'], ['Document Type', 'document type'], ['Document Source', 'document source'],
    ['Delivery Document Type', 'delivery document type'], ['Reason', 'reason'], ['Delivery Type', 'delivery type'], ['Dawaa Now', 'dawaa now'], ['Limit', 'limit'],
  ];
  const lc = (s) => String(s || '').toLowerCase().replace(/\s+/g, '');
  const MATCH = {
    'store code': (d, v) => lc(d.store) === lc(v),
    'delivery no': (d, v) => d.deliveryNo.includes(v.trim()),
    'customer phone': (d, v) => d.mobile.includes(v.trim()),
    'document no': (d, v) => d.documentNo.includes(v.trim()),
    'order no': (d, v) => d.orderNo.includes(v.trim()),
    'document type': (d, v) => lc(d.documentType) === lc(v),
    'document source': (d, v) => lc(d.source) === lc(v),
    'delivery document type': (d, v) => lc(d.deliveryDocType) === lc(v),
    'reason': (d, v) => lc(d.reason) === lc(v),
    'delivery type': (d, v) => lc(d.deliveryType) === lc(v),
    'dawaa now': (d, v) => (lc(v) === 'yes' ? d.dawaaNow : lc(v) === 'no' ? !d.dawaaNow : true),
  };
  const VIEWS = [
    { k: 'all', l: 'All deliveries', ic: 'layers', f: () => true },
    { k: 'attention', l: 'Needs attention', ic: 'alert', f: (d) => d.failedJobs > 0, bad: true },
    { k: 'cancelreq', l: 'Cancellation requested', ic: 'ban', f: (d) => d.status === 'Cancellation requested' },
    { k: 'dawaa', l: 'Dawaa Now', ic: 'zap', f: (d) => d.dawaaNow },
    { k: 'resched', l: 'Rescheduled', ic: 'calendar', f: (d) => d.rescheduled },
    { k: 'p042', l: 'Store P042', ic: 'map', f: (d) => d.store === 'P042' },
  ];
  function baseRows() {
    return window.DATA.deliveries.filter((d) => S.tokens.every((t) => !t.v || !MATCH[t.k] || MATCH[t.k](d, t.v)));
  }
  function viewRows() { const v = VIEWS.find((x) => x.k === S.view) || VIEWS[0]; return baseRows().filter(v.f); }

  function inspector(d) {
    if (!d) return '<div class="f-empty">Select a delivery to inspect it.</div>';
    const steps = ['Created', 'Paid', 'Ready', 'Out for delivery', 'Delivered'];
    const reach = { 'Delivered': 4, 'Out for delivery': 3, 'Ready': 2, 'Cancellation requested': 2, 'Cancelled': 2 }[d.status] || 0;
    const tl = steps.map((s, i) => {
      let cls = i < reach ? 'done' : i === reach ? 'cur' : '';
      let label = s;
      if (i === 1 && d.due > 0 && i <= reach) { cls = 'part'; label = 'Part paid'; }
      if (i === reach && d.status === 'Cancelled') { cls = 'stop'; label = 'Cancelled'; }
      if (i === reach && d.status === 'Cancellation requested') { cls = 'req'; label = 'Cancel asked'; }
      if (i === 4 && d.status === 'Delivered') cls = 'done cur';
      return '<div class="f-tl-s ' + cls + '"><i></i><span>' + esc(label) + '</span></div>';
    }).join('');
    const items = window.DATA.detail.items.filter((x) => !x.deleted).slice(0, 3);
    return '' +

        const el = M.querySelector('#f-insp'); if (el) el.innerHTML = inspector(r);
        const sc = M.querySelector('#f-selc'); if (sc) sc.textContent = (r ? 1 : 0) + ' selected';
      },
      onCellFocused: (p) => {
        if (p.rowIndex == null || p.rowPinned) return;
        const n = p.api.getDisplayedRowAtIndex(p.rowIndex);
        if (n && !n.isSelected()) n.setSelected(true, true);
      },
      onRowDoubleClicked: () => C.go('details'),
    });
    if (!rows.length) M.querySelector('#f-insp').innerHTML = inspector(null);

    function move(dlt) {
      if (!api) return;
      const cur = api.getSelectedNodes()[0];
      const count = api.getDisplayedRowCount();
      if (!count) return;
      const idx = Math.min(count - 1, Math.max(0, (cur ? cur.rowIndex : -1) + dlt));
      const n = api.getDisplayedRowAtIndex(idx);
      if (n) { n.setSelected(true, true); api.ensureIndexVisible(idx); }
    }
    function commitTok(input) {
      const i = +input.dataset.tok;
      if (S.tokens[i]) S.tokens[i].v = input.value.trim();
      S.menu = false; C.rerender();
    }

    const scr = {
      click(e, t) {
        const a = t.dataset.act;
        if (a === 'view') { S.view = t.dataset.k; C.rerender(); return true; }
        if (a === 'tok-x') { S.tokens.splice(+t.dataset.i, 1); C.rerender(); return true; }
        if (a === 'menu') { S.menu = !S.menu; C.rerender(); return true; }
        if (a === 'addtok') {
          const k = t.dataset.k;
          let i = S.tokens.findIndex((x) => x.k === k);
          if (i < 0) { S.tokens.push({ k, v: k === 'date' ? '2026-10-01 → 2026-10-03' : '' }); i = S.tokens.length - 1; }
          S.menu = false; S.focusTok = i; C.rerender(); return true;
        }
        return false;
      },
      input(e) {
        if (e.target.dataset.tok !== undefined) {
          e.target.size = Math.max(4, e.target.value.length);
          M.querySelector('#f-query').classList.add('pending');
          M.querySelector('#f-qhint').innerHTML = 'Edited — press ' + kbd('↵') + ' to search';
        }
      },
      key(e) {
        const t = e.target;
        if (t.dataset && t.dataset.tok !== undefined) {
          if (e.key === 'Enter') { e.preventDefault(); commitTok(t); }
          else if (e.key === 'Escape') t.blur();
          return;
        }
        if (isTyping(t) || e.ctrlKey || e.metaKey || e.altKey) return;
        const inGrid = !!t.closest('.ag-root-wrapper');
        if (e.key === 'Escape' && S.menu) { S.menu = false; C.rerender(); return; }
        if (e.key === 'j' || (!inGrid && e.key === 'ArrowDown')) { e.preventDefault(); move(1); }
        else if (e.key === 'k' || (!inGrid && e.key === 'ArrowUp')) { e.preventDefault(); move(-1); }
        else if (e.key === 'Enter') { if (t.closest('button, a, summary')) return; e.preventDefault(); C.go('details'); }
        else if (e.key === 'r') toast('Reschedule ' + (S.selNo || '') + ' — the form opens here (preview only)');
        else if (e.key === 'c') toast('Request cancellation — choose a reason (preview only)');
        else if (e.key === 'n') toast('Add note — opens the composer (preview only)');
        else if (e.key === '/') { e.preventDefault(); const f = M.querySelector('[data-tok]'); if (f) f.focus(); }
      },
    };
    if (S.focusTok >= 0) { const f = M.querySelector('[data-tok="' + S.focusTok + '"]'); S.focusTok = -1; if (f) f.focus(); }
    return scr;
  }

  function feedItems() {

    const tm = (s) => (/(\d\d:\d\d [AP]M)/.exec(s) || [s])[0];
    const out = D.log.map((l) => ({ k: key(l.time), time: tm(l.time), kind: 'log', title: l.action, by: l.user, note: l.note }))

    out.sort((a, b) => (a.k < b.k ? -1 : 1));
    return out.concat(S.notes);

      return R.cmds.map((c, i) => '<div class="f-res-r" role="option" aria-selected="' + (i === cc.cur) + '"><span class="t"><span class="m">' + esc(c[0]) + '</span><small>' + esc(c[1]) + '</small></span><span></span><button type="button" class="f-btn" data-act="slash" data-k="' + c[2] + '">Open' + (i === cc.cur ? ' ' + kbd('↵') : '') + '</button></div>').join('') || '<div class="f-empty">No command starts with “' + esc(cc.q) + '”.</div>';
    }
    if (cc.cur >= R.rows.length) cc.cur = 0;
    const dot = { pos: 'ok', neg: 'bad', unk: 'warn' };
    return (R.rows.map((r, i) => '<div class="f-res-r" role="option" aria-selected="' + (i === cc.cur) + '">' +
      '<span class="t"><span>' + esc(r.title) + '</span><small><span class="m">' + esc(r.item) + '</span> · <bdi lang="ar" dir="rtl">' + esc(r.ar) + '</bdi> · <span class="m">≈' + money(r.est) + '</span> before VAT</small></span>' +
      '<span class="f-st f-st-' + dot[r.atp] + '"><i></i>' + (r.atp === 'unk' ? '? ' : '') + esc(r.atpText) + '</span>' +
      '<button type="button" class="f-btn' + (i === cc.cur ? ' f-btn-pri' : '') + '" data-act="add" data-item="' + r.item + '">' + ic('plus', 13) + 'Add' + (i === cc.cur ? ' ' + kbd('↵') : '') + '</button></div>').join('') ||
      '<div class="f-empty">No items match “' + esc(cc.q) + '”.</div>') +
      '<div class="f-res-note">Catalogue prices are estimates before VAT — the basket price is what the caller pays.</div>';
  }
  function renderCC() {
    if (!S.cc) S.cc = ccInit();
    const cc = S.cc, CD = window.DATA.cc, K = ccCalc(cc);
    const slot = (k, label) => {
      const v = cc.slots[k];
      return '<button type="button" class="f-slot' + (v ? '' : ' unset') + '" data-act="slot" data-slot="' + k + '" aria-expanded="' + (cc.pop === k) + '">' + (v ? esc(v) : 'choose…') + '</button>';
    };
    const collect = K.collect;
    const sentence = (collect ? slot('fulfil') + ' at ' + slot('store') : slot('fulfil') + ' from ' + slot('store') + ' ' + slot('slot')) +
      ' · source ' + slot('source') + ' · paying by ' + slot('pay') + ' · coupon ' + slot('coupon');
    const pop = cc.pop ? '<div class="f-pop" id="f-pop" role="listbox" aria-label="' + esc(SLOT_OPTS[cc.pop].h) + '"><div class="f-pop-h"><span>' + esc(SLOT_OPTS[cc.pop].h) + '</span>' + kbd('Esc') + '</div>' +
      SLOT_OPTS[cc.pop].o.map((o) => '<button type="button" class="o" data-act="pick" data-v="' + esc(o) + '">' + (cc.slots[cc.pop] === o ? ic('check', 14) : '<span style="width:14px"></span>') + esc(o) + '</button>').join('') + '</div>' : '';
    const checks = [['Caller attached', true], [collect ? 'Collection store' : 'Delivery address', true], [collect ? 'No slot needed' : 'Delivery slot', collect || !!cc.slots.slot], ['Items in the basket', cc.basket.length > 0], ['Payment type', !!cc.slots.pay]];
    const ready = checks.every((c) => c[1]);
    const basket = cc.basket.map((b, i) => '<div class="f-bl"><span class="t"><span>' + esc(b.title) + '</span><small class="m muted">' + esc(b.item) + ' · ' + esc(b.atp) + (b.below ? ' · <span class="flag">accepted below availability</span>' : '') + '</small></span>' +
      '<span class="f-qty"><button type="button" data-act="qty" data-i="' + i + '" data-d="-1" aria-label="Fewer">' + ic('minus', 12) + '</button><span>' + b.qty + ' ' + esc(b.uom) + '</span><button type="button" data-act="qty" data-i="' + i + '" data-d="1" aria-label="More">' + ic('plus', 12) + '</button></span>' +
      '<span class="num muted">× ' + money(b.unit) + '</span><span class="num"><b>' + money(b.total) + '</b></span>' +
      '<button type="button" class="f-ibtn" data-act="void" data-i="' + i + '" aria-label="Void line">' + ic('x', 14) + '</button>' +
      '<div class="why">Priced by Basic price · VAT 15%' + (b.offer ? ' · OFFER <span class="m">' + esc(b.offer.id) + '</span> ' + esc(b.offer.desc) + ' <b class="m">' + money(b.offer.amt) + '</b>' : '') + '</div></div>').join('') || '<div class="f-empty">Nothing added yet.</div>';
    const offers = CD.offers.filter((o) => o.state === 'reach').map((o) => {
      const done = !!cc.added[o.id];
      const have = done ? o.need : o.have;
      return '<div class="f-offer"><div class="f-offer-h"><b>' + esc(o.head) + '</b><span class="muted">' + esc(o.desc) + '</span><span class="sp"></span><span class="m muted">' + esc(o.id) + '</span></div>' +
        '<div class="f-meter' + (done ? ' done' : '') + '"><i style="width:' + (have / o.need * 100) + '%"></i></div>' +
        '<div style="display:flex;justify-content:space-between"><span class="m" style="white-space:nowrap">' + have + ' of ' + o.need + '</span><span class="' + (done ? 'f-ok-line' : 'muted') + '">' + (done ? 'Added — this offer applied.' : 'add 1 more · ' + esc(o.set)) + '</span></div>' +
        (done ? '' : o.picks.map((p) => '<div class="f-pick"><span>' + esc(p.title) + '</span><span class="m muted">≈' + money(p.est) + '</span><button type="button" class="f-btn" data-act="offer-add" data-o="' + o.id + '" data-item="' + p.item + '">Add</button></div>').join('')) + '</div>';
    }).join('') +
      CD.offers.filter((o) => o.state === 'counted').map((o) => '<div class="muted" style="font-size:11.5px">' + ic('check', 12) + ' <span class="m">' + esc(o.id) + '</span> ' + esc(o.head) + ' — already counted on the basket.</div>').join('') +
      '<div class="muted" style="font-size:11.5px">1 more offer can\'t be reached from this basket: Buy 2 get 1 — vitamins · ' + esc(CD.offers[2].reason) + '.</div>';
    const receipt = cc.placed
      ? '<div class="f-placed"><span class="f-h" style="color:var(--ok-ink)">Order placed</span><span class="muted">Order number</span><span class="no">1000080512</span><span>Read this number to the caller.</span><button type="button" class="f-btn" data-act="next" style="justify-self:start;margin-block-start:6px">Start the next order</button></div>'
      : '<div class="f-rcpt"><span class="f-h" style="margin-block-end:4px">The caller pays</span>' +
        '<div class="r"><span>Items</span><span>' + money(K.net) + '</span></div><div class="r"><span>VAT</span><span>' + money(K.vat) + '</span></div>' +
        (K.collect ? '' : '<div class="r"><span>Delivery</span><span class="' + (K.waived ? 'waived' : '') + '">' + (K.waived ? 'waived' : money(K.delivery)) + '</span></div><small>' + (K.waived ? 'This basket is over the free-delivery threshold.' : 'Delivery is free over ' + money(CD.receipt.freeOver) + ' SAR.') + '</small>') +
        '<div class="r total"><span>Total · SAR</span><span>' + money(K.total) + '</span></div></div>' +
        '<ul class="f-check" aria-label="Ready to place">' + checks.map(([l, ok]) => '<li class="' + (ok ? 'ok' : 'no') + '">' + ic(ok ? 'check' : 'alert', 14) + '<span style="color:var(--ink' + (ok ? '-2' : '') + ')">' + esc(l) + '</span></li>').join('') + '</ul>' +
        '<button type="button" class="f-btn f-btn-pri f-btn-block" data-act="place"' + (ready ? '' : ' disabled aria-disabled="true"') + '>Place order ' + kbd('Ctrl') + kbd('↵') + '</button>' +
        (ready ? '' : '<span style="color:var(--warn-ink);font-size:11.5px">Needed first: ' + checks.filter((c) => !c[1]).map((c) => c[0].toLowerCase()).join(' · ') + '</span>');
    const caller = CD.caller;
    const body = '<div class="f-cc">' +
      '<header class="f-cc-caller"><span class="f-av" aria-hidden="true">FA</span><div><div style="display:flex;align-items:center;gap:8px"><span class="nm">' + esc(caller.name) + '</span><span class="f-tier">' + ic('star', 11) + esc(caller.tier) + '</span><span class="m muted">' + C.int(caller.points) + ' pts</span></div>' +
        '<div class="meta"><span class="m">' + esc(caller.mobile) + '</span><span>Member <span class="m">' + esc(caller.member) + '</span></span><button type="button" class="f-link" data-act="toast" data-msg="2 open requests for this caller (preview only)">' + CD.requests + ' open requests</button></div></div>' +
        '<span class="sp"></span><span class="muted">New order · <span class="m">' + esc(CD.docType) + '</span> · ' + esc(CD.operator) + '</span>' +
        '<button type="button" class="f-btn f-btn-bad" data-act="toast" data-msg="Abandon this order? Asks for a confirmation step first (preview only)">Abandon order</button></header>' +
      '<div class="f-cc-sentence" id="f-sent">' + sentence + pop + '</div>' +
      '<div class="f-cc-cols">' +
        '<section class="f-cc-center">' +
          '<label class="f-search">' + ic('search', 18) + '<input id="f-ccq" value="' + esc(cc.q) + '" autocomplete="off" spellcheck="false" aria-label="Search items" placeholder="Search items — name, Arabic name, or item number"><kbd>↑</kbd><kbd>↓</kbd><kbd>↵</kbd></label>' +
          '<div class="f-slash"><span>Type a slash for a command:</span><span class="m">/store</span><span class="m">/slot</span><span class="m">/coupon</span><span class="m">/pay</span><span>· ' + kbd('Ctrl') + kbd('K') + ' for everything else</span></div>' +
          '<div class="f-res" id="f-res" role="listbox" aria-label="Search results">' + ccResultsHtml(cc) + '</div>' +
          '<div class="f-bask"><header><b>Basket</b><span class="muted">prices include VAT</span><span class="sp"></span><span class="f-pill">' + cc.basket.length + ' lines</span></header>' + basket + '</div>' +
        '</section>' +
        '<aside class="f-cc-side" aria-label="Order summary">' + receipt +
          '<div style="display:flex;align-items:baseline;gap:8px;margin-block-start:4px"><h4 class="f-h">Offers within reach</h4><span class="muted" style="font-size:11.5px">discounts only</span></div>' + offers +
        '</aside>' +
      '</div>' +
    '</div>';
    M.innerHTML = shell('cc', body);

    const popEl = M.querySelector('#f-pop');
    if (popEl) {
      const btn = M.querySelector('[data-slot="' + cc.pop + '"]');
      const wrap = M.querySelector('#f-sent');
      const rtl = document.documentElement.dir === 'rtl';
      const x = rtl ? wrap.clientWidth - btn.offsetLeft - btn.offsetWidth : btn.offsetLeft;
      popEl.style.insetInlineStart = Math.max(8, Math.min(x, wrap.clientWidth - 290)) + 'px';
      popEl.style.insetBlockStart = (btn.offsetTop + btn.offsetHeight + 4) + 'px';
      const first = popEl.querySelector('button.o'); if (first) first.focus();
    }

    function addItem(itemNo, offerId) {
      const r = CD.search.rows.find((x) => x.item === itemNo) || null;
      const pk = !r && CD.offers.flatMap((o) => o.picks || []).find((x) => x.item === itemNo);
      const src = r || pk; if (!src) return;
      const unit = Math.round(src.est * 1.15 * 100) / 100;
      const ex = cc.basket.find((b) => b.item === itemNo);
      if (ex) { ex.qty += 1; ex.total = +(ex.unit * ex.qty).toFixed(2); }
      else cc.basket.push({ item: itemNo, title: src.title, qty: 1, uom: 'EA', unit, total: unit,
        atp: r ? (r.atp === 'pos' ? r.atpText.replace(' in stock', '') + ' at add' : r.atp === 'neg' ? 'none at add' : '? unknown at add') : src.atp + ' at add',
        below: r ? r.atp === 'neg' : false, offer: offerId ? { id: offerId, desc: '20% off — oral care', amt: -Math.round(unit * 20) / 100 } : null });
      if (offerId) cc.added[offerId] = true;
      cc.placed = false;
      C.rerender();
      const q = M.querySelector('#f-ccq'); if (q && !offerId) q.focus();
      toast('Added ' + src.title + (r && r.atp === 'neg' ? ' — below availability, accepted' : ''));
    }
    function place() { if (cc.placed) return; const K2 = ccCalc(cc); const ok = cc.slots.pay && cc.basket.length && (K2.collect || cc.slots.slot); if (!ok) { toast('Needed first: ' + (!cc.slots.pay ? 'choose how they are paying' : !cc.basket.length ? 'add an item' : 'choose a delivery slot')); return; } cc.placed = true; C.rerender(); }
    function moveCur(d) {
      const R = ccResults(cc); const n = (R.cmds || R.rows).length; if (!n) return;
      cc.cur = (cc.cur + d + n) % n; M.querySelector('#f-res').innerHTML = ccResultsHtml(cc);
      const s = M.querySelector('#f-res [aria-selected="true"]'); if (s) s.scrollIntoView({ block: 'nearest' });
    }
    return {
      click(e, t) {
        const a = t.dataset.act;
        if (a === 'slot') { cc.pop = cc.pop === t.dataset.slot ? null : t.dataset.slot; C.rerender(); return true; }
        if (a === 'pick') {
          let v = t.dataset.v; const k = cc.pop;
          if (k === 'coupon' && v === 'No coupon') v = '';
          if (k === 'fulfil' && v === 'They collect in store') { cc.slots.slot = ''; }
          if (k === 'fulfil' && v !== 'They collect in store' && !cc.slots.slot) cc.slots.slot = 'Today 18:00–21:00';
          if (k === 'coupon' && !v) { cc.slots.coupon = ''; } else cc.slots[k] = v;
          cc.pop = null; C.rerender(); return true;
        }
        if (a === 'slash') { cc.pop = t.dataset.k; cc.q = ''; C.rerender(); return true; }
        if (a === 'add') { addItem(t.dataset.item); return true; }
        if (a === 'offer-add') { addItem(t.dataset.item, t.dataset.o); return true; }
        if (a === 'qty') { const b = cc.basket[+t.dataset.i]; b.qty = Math.max(1, b.qty + +t.dataset.d); b.total = +(b.unit * b.qty).toFixed(2); C.rerender(); return true; }
        if (a === 'void') { cc.basket.splice(+t.dataset.i, 1); C.rerender(); return true; }
        if (a === 'place') { place(); return true; }
        if (a === 'next') { S.cc = ccInit(); C.rerender(); return true; }
        if (cc.pop && !t.closest('#f-pop')) { cc.pop = null; C.rerender(); }
        return false;
      },
      input(e) {
        if (e.target.id === 'f-ccq') { cc.q = e.target.value; cc.cur = 0; M.querySelector('#f-res').innerHTML = ccResultsHtml(cc); }
      },
      key(e) {
        const t = e.target;
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); place(); return; }
        if (e.key === 'Escape' && cc.pop) { cc.pop = null; C.rerender(); return; }
        if (t.id === 'f-ccq') {
          if (e.key === 'ArrowDown') { e.preventDefault(); moveCur(1); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); moveCur(-1); }
          else if (e.key === 'Enter') {
            e.preventDefault();
            const R = ccResults(cc);
            if (R.cmds) { const c = R.cmds[cc.cur]; if (c) { cc.pop = c[2]; cc.q = ''; C.rerender(); } }
            else { const r = R.rows[cc.cur]; if (r) addItem(r.item); }

        }

        if (e.key === '/') { e.preventDefault(); const q = M.querySelector('#f-ccq'); q.value = '/'; cc.q = '/'; cc.cur = 0; M.querySelector('#f-res').innerHTML = ccResultsHtml(cc); q.focus(); }

  /* ---------------- render + dispatch ---------------- */
  function render(screen, mount, ctx) {
    C = ctx; M = mount; S.pal = false;
    if (screen !== 'details') S.more = false;
    if (screen !== 'list') S.menu = false;
    if (screen === 'list' && ctx.state.sel) S.selNo = ctx.state.sel;

    mount.onclick = (e) => {
      const t = e.target.closest('[data-act]');
      if (!t || !mount.contains(t)) { if (scr && scr.click) scr.click(e, { dataset: {}, closest: (sel) => e.target.closest(sel) }); return; }
      const a = t.dataset.act;
      if (a === 'pal-open') { palOpen(); return; }
      if (a === 'pal-close') { palClose(); return; }
      if (a === 'pal-run') { palRun(+t.dataset.i); return; }
      if (scr && scr.click && scr.click(e, t)) return;
      if (a === 'toast') toast(t.dataset.msg);
      else if (a === 'soon') toast((t.dataset.label || 'This area') + ' is outside this study');
    };
    mount.oninput = (e) => {
      if (e.target.id === 'f-pal-input') { S.palIdx = 0; palRender(); return; }
      if (scr && scr.input) scr.input(e);
    };
    mount.onchange = (e) => { if (scr && scr.input && e.target.tagName === 'SELECT') scr.input(e); };
    document.onkeydown = (e) => {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); if (S.pal) palClose(); else palOpen(); return; }
      if (S.pal) {
        const n = (S.palItems || []).length;
        if (e.key === 'Escape') { e.preventDefault(); palClose(); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); if (n) { S.palIdx = (S.palIdx + 1) % n; palRender(); } }
        else if (e.key === 'ArrowUp') { e.preventDefault(); if (n) { S.palIdx = (S.palIdx - 1 + n) % n; palRender(); } }
        else if (e.key === 'Enter') { e.preventDefault(); palRun(S.palIdx); }
        return;
      }
      if (scr && scr.key) scr.key(e);
    };
  }

  /* ---------------- adoption notes ---------------- */
  const notes = {
    direction: {
      idea: 'A keyboard-first operations console with its own al-dawaa identity: navy rail, gold as the single signal colour, monospaced identifiers and money, and a command palette that reaches every screen and action. Density goes up, page-hopping goes down: list and record live side by side.',
      system: [
        'New token set (navy/gold identity, Plex Sans + Plex Mono, 26px rows, 28px controls) replaces the steel set in src/app/global.css; the domain families (cancel-request indigo, prescription teal, POST violet, fulfilment green) carry over as semantic tokens.',
        'Promotes the call center CommandPalette (src/features/callcenter/console/CommandPalette.tsx) to an app-wide @/core/ui palette with a registry each feature contributes verbs to — new shared infrastructure, not a reskin.',
        'Keyboard model (J/K, Enter, R/C/N, /, Ctrl+K, Ctrl+Enter) needs one shortcut registry in @/core so features cannot collide, plus a "?" cheat sheet for training.',
        'Everything shown runs on AG Grid Community 36 (pinned columns, pinned totals, text selection, row selection); no Enterprise feature is assumed.',
        'Highest payoff for heavy daily users (call center, OMS back office); highest risk for occasional users who will not discover shortcuts — every action must stay reachable by mouse.',
      ],
    },
    list: {
      retheme: 'Large', rebuild: 'Large',
      changes: [
        'DeliveriesPage becomes a three-pane workspace: saved views (with live counts) · token query bar · grid · inspector.',
        'The 14 production criteria survive as tokens behind "+ Filter"; DeliveryFilterCriteria and buildDeliveryQuery stay the contract — only the editor changes, and Enter remains the deliberate "search" act.',
        'ViewManager saved views move from a select into the sidebar and gain counts, which needs either cheap count queries or counts over the loaded set (as here).',
        'The inspector duplicates part of DocumentDetailsPage (identity, status, money, commands) — it must be one shared component lifted to @/core, not a second copy.',
      ],
      keeps: ['Same columns and AG Grid Community grid, pinned Delivery no., native text selection + Ctrl+C.', 'Open Order / Open Delivery become Enter / "Open full record"; Export, Columns and saved views keep their behaviour.', 'Search criteria still choose what loads; grid column filters still narrow loaded rows.'],
      risks: ['380px inspector costs grid width on 1280px screens — needs a collapse toggle.', 'Token editing is less obvious than labelled fields for occasional users; date pairing must stay explicit.', 'Selection-follows-focus changes how keyboard users move through rows today.'],
    },
    details: {
      retheme: 'Large', rebuild: 'Medium',
      changes: [
        'IdentityBand + StatusRail are replaced by a record header and a full-width progress stepper; the 13 statuses stay one click away.',
        'Log and Jobs tabs merge into one chronological Activity column with a note composer (Add Note… moves there); failed jobs surface as a banner with Retry.',
        'Summary rail cards become sections in the main column; Items and Header Conditions shown together instead of behind tabs.',
        'Commands keep their families (fulfilment, cancellation request, destructive) but destructive ones move into a separated More menu.',
      ],
      keeps: ['Every command, its disabled-reason tooltips and its dialogs (Reschedule, Change Store, Return, Request Cancellation).', 'Items grid with deleted rows struck through and pinned totals footer.', 'Domain meanings: cancellation request ≠ cancelled, prescription teal, Dawaa Now mark.'],
      risks: ['Hiding Cancel Order / Force Cancel in More is a behaviour change operators must agree to.', 'A merged feed needs one server ordering rule for log vs outbox times.', 'Retry job is a new command — no endpoint exists for it today.'],
    },
    sim: {
      retheme: 'Large', rebuild: 'Large',
      changes: [
        'The collapsing run strip becomes a permanent inputs pane; results never move when inputs open.',
        'The expandable results rows become a selectable list plus a to-scale price waterfall per line, with the Pricing elements trace under it.',
        'Promotions rail keeps the buy→get blocks and near-miss meter in its own column.',
      ],
      keeps: ['Every input (plant, date, org, channel, procedure key, loyalty group/tier, promotion, pricing elements, items, manual conditions) and Process = Ctrl+Enter.', 'Inputs-changed staleness, not-priced lines with the engine message, near-miss wording.'],
      risks: ['Three panes need ≥1280px; below that the promotions pane must stack.', 'The waterfall is new chart code (SimLineExpansion today is tabular) and needs its own accessibility text.'],
    },
    cc: {
      retheme: 'Large', rebuild: 'Large',
      changes: [
        'Header chips become one editable sentence of slots; unset slots read as dashed warnings and open inline pickers.',
        'Item search becomes the keyboard spine: ↑↓ + Enter adds, "/" opens slash commands (/store /slot /coupon /pay) next to the existing Ctrl+K palette.',
        'Receipt gains a readiness checklist; Place order is Ctrl+Enter and stays disabled until the server-side blockers are clear.',
        'Customer rail collapses into the caller header (lookup and sign-up would open as a step before this view).',
      ],
      keeps: ['Opening steps, blockers, below-availability acceptance, offers within reach with meters, rebind and abandon confirmations.', 'Server-authoritative pricing — the client still never computes money it shows as final.'],
      risks: ['Dropping the fixed 260px customer rail changes muscle memory for the current console users.', 'The sentence layout must wrap gracefully in Arabic/RTL — needs its own RTL pass.', 'Slash commands overlap the palette verbs; one registry must serve both.'],
    },
  };

  window.DIRS.far = { tag: 'Far', label: 'Ops Console', render, notes };
})();

</script>
<script>
/* Retheme study — shared harness: state, routing, icons, grid helper, formatters.
   Each direction registers itself on window.DIRS[key] = { label, tag, render(screen, mount, ctx), notes }. */
(function () {
  'use strict';
  window.DIRS = window.DIRS || {};

  /* ---------- icons (lucide-style strokes, inline) ---------- */
  const P = {
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    filter: '<path d="M3 5h18l-7 8v6l-4-2v-4z"/>',
    chevronDown: '<path d="m6 9 6 6 6-6"/>',
    chevronRight: '<path d="m9 6 6 6-6 6"/>',
    chevronLeft: '<path d="m15 6-6 6 6 6"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',

    zap: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
    layers: '<path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',

    link: '<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',

  };
  function icon(name, size, cls) {
    const s = size || 16;
    return '<svg class="ic' + (cls ? ' ' + cls : '') + '" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (P[name] || '') + '</svg>';
  }

  /* ---------- formatters ---------- */
  const nf2 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const nf0 = new Intl.NumberFormat('en-US');
  const money = (v) => (v == null || v === '' ? '' : nf2.format(+v));
  const int = (v) => (v == null || v === '' ? '' : nf0.format(+v));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function h(strings, ...vals) { // tagged template: interpolations are already-safe html
    let out = '';
    strings.forEach((s, i) => { out += s + (i < vals.length ? (Array.isArray(vals[i]) ? vals[i].join('') : vals[i] == null || vals[i] === false ? '' : vals[i]) : ''); });
    return out;
  }

  /* ---------- AG Grid ---------- */
  let gridApis = [];
  const themes = {};
  function gridTheme(dirKey, params) {
    if (!themes[dirKey]) {
      themes[dirKey] = agGrid.themeQuartz
        .withParams(Object.assign({
          backgroundColor: 'var(--g-bg)',
          foregroundColor: 'var(--g-fg)',
          oddRowBackgroundColor: 'var(--g-odd)',
          rowHoverColor: 'var(--g-hover)',
          headerBackgroundColor: 'var(--g-head-bg)',
          headerTextColor: 'var(--g-head-fg)',
          borderColor: 'var(--g-border)',
          rowBorder: { color: 'var(--g-row-border)' },
          headerRowBorder: { color: 'var(--g-head-border)' },
          selectedRowBackgroundColor: 'var(--g-selected)',
          accentColor: 'var(--g-accent)',
          pinnedRowBackgroundColor: 'var(--g-head-bg)',
          inputBackgroundColor: 'var(--g-bg)',
          inputBorder: { color: 'var(--g-border)' },
        }, params))
        .withParams({ browserColorScheme: 'light' }, 'light')
        .withParams({ browserColorScheme: 'dark' }, 'dark');
    }
    return themes[dirKey];
  }
  function grid(el, dirKey, params, options) {
    if (!el) return null;
    const api = agGrid.createGrid(el, Object.assign({
      theme: gridTheme(dirKey, params),
      enableCellTextSelection: true,
      ensureDomOrder: true,
      enableRtl: document.documentElement.dir === 'rtl',
      defaultColDef: { sortable: true, resizable: true, filter: true, suppressHeaderMenuButton: false },
      animateRows: false,
    }, options));
    gridApis.push(api);
    return api;
  }
  function destroyGrids() { gridApis.forEach((a) => { try { a.destroy(); } catch (e) { /* already gone */ } }); gridApis = []; }

  /* ---------- harness state ---------- */
  const SCREENS = [
    { key: 'list', label: 'OMS List' },
    { key: 'details', label: 'Delivery Details' },
    { key: 'sim', label: 'Simulation' },
    { key: 'cc', label: 'Call Center' },
  ];
  const ORDER = ['near', 'mid', 'far'];
  const state = { dir: 'near', screen: 'list', theme: 'system', notes: false, sel: null };

  function readHash() {
    const m = /^#(near|mid|far)\.(list|details|sim|cc)$/.exec(location.hash || '');
    if (m) { state.dir = m[1]; state.screen = m[2]; }
  }
  function store(k, v) { try { localStorage.setItem('retheme.' + k, v); } catch (e) { /* storage unavailable */ } }
  function load(k) { try { return localStorage.getItem('retheme.' + k); } catch (e) { return null; } }

  function applyTheme() {
    const root = document.documentElement;
    if (state.theme === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', state.theme);
    const dark = state.theme === 'dark' || (state.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-ag-theme-mode', dark ? 'dark' : 'light');
  }

  const ctx = {
    icon, money, int, esc, h,
    grid: (el, params, options) => grid(el, state.dir, params, options),
    go: (screen, extra) => { if (extra) Object.assign(state, extra); state.screen = screen; render(); },
    get state() { return state; },
    rerender: () => render(),
  };
  window.RT = ctx;

  function renderChrome() {
    const d = window.DIRS[state.dir] || {};
    document.querySelectorAll('[data-dir-btn]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.dirBtn === state.dir)));
    document.querySelectorAll('[data-screen-btn]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.screenBtn === state.screen)));
    document.querySelectorAll('[data-theme-btn]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themeBtn === state.theme)));
    const nb = document.getElementById('notes-btn');
    nb.setAttribute('aria-expanded', String(state.notes));
    const drawer = document.getElementById('notes');
    drawer.hidden = !state.notes;
    const n = (d.notes && d.notes[state.screen]) || null;
    const all = d.notes && d.notes.direction;
    drawer.innerHTML = n ? notesHtml(d, all, n) : '';
  }
  function notesHtml(d, all, n) {
    const tier = (t) => '<span class="tier tier-' + t.toLowerCase() + '">' + t + '</span>';
    return h`
      <header class="notes-head">
        <div><div class="eyebrow">${esc(d.tag)}</div><h2>${esc(d.label)}</h2></div>
        <button class="rb-icon" type="button" data-close-notes aria-label="Close notes">${icon('x', 16)}</button>
      </header>
      <section><p class="lede">${esc(all.idea)}</p></section>
      <section class="effort"><h3>What it takes to adopt this screen</h3>
        <div class="effort-row"><span>Visual retheme</span>${tier(n.retheme)}</div>
        <div class="effort-row"><span>Structural rebuild</span>${tier(n.rebuild)}</div>
      </section>
      <section><h3>What changes on this screen</h3><ul>${n.changes.map((c) => '<li>' + esc(c) + '</li>')}</ul></section>
      <section><h3>Kept from today</h3><ul>${n.keeps.map((c) => '<li>' + esc(c) + '</li>')}</ul></section>
      <section><h3>Watch out for</h3><ul>${n.risks.map((c) => '<li>' + esc(c) + '</li>')}</ul></section>
      <section class="notes-foot"><h3>Direction-wide</h3><ul>${all.system.map((c) => '<li>' + esc(c) + '</li>')}</ul></section>`;
  }

  function render() {
    destroyGrids();
    const mount = document.getElementById('app');
    const d = window.DIRS[state.dir];
    mount.className = 'app dir-' + state.dir;
    mount.innerHTML = '';
    mount.onclick = mount.oninput = mount.onchange = mount.onkeydown = null;
    document.onkeydown = null;
    if (d) d.render(state.screen, mount, ctx);
    renderChrome();
    const hash = '#' + state.dir + '.' + state.screen;
    if (location.hash !== hash) history.replaceState(null, '', hash);
    store('dir', state.dir); store('screen', state.screen);
  }

  function boot() {
    agGrid.ModuleRegistry.registerModules([agGrid.AllCommunityModule]);
    state.dir = load('dir') || state.dir;
    state.screen = load('screen') || state.screen;
    state.theme = load('theme') || state.theme;
    readHash();
    applyTheme();
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

    const dirBar = document.getElementById('dir-bar');
    dirBar.innerHTML = ORDER.map((k) => { const d = window.DIRS[k]; return '<button type="button" class="rb-seg" data-dir-btn="' + k + '"><span class="rb-seg-k">' + esc(d.tag) + '</span><span class="rb-seg-l">' + esc(d.label) + '</span></button>'; }).join('');
    const scrBar = document.getElementById('screen-bar');
    scrBar.innerHTML = SCREENS.map((s) => '<button type="button" role="tab" class="rb-tab" data-screen-btn="' + s.key + '">' + esc(s.label) + '</button>').join('');

    document.addEventListener('click', (e) => {
      const t = e.target.closest('[data-dir-btn],[data-screen-btn],[data-theme-btn],#notes-btn,[data-close-notes],[data-go]');
      if (!t) return;
      if (t.dataset.dirBtn) { state.dir = t.dataset.dirBtn; render(); }
      else if (t.dataset.screenBtn) { state.screen = t.dataset.screenBtn; render(); }
      else if (t.dataset.themeBtn) { state.theme = t.dataset.themeBtn; store('theme', state.theme); applyTheme(); renderChrome(); }
      else if (t.id === 'notes-btn') { state.notes = !state.notes; renderChrome(); }
      else if (t.hasAttribute('data-close-notes')) { state.notes = false; renderChrome(); }
      else if (t.dataset.go) { if (t.dataset.doc) state.sel = t.dataset.doc; state.screen = t.dataset.go; render(); }
    });
    window.addEventListener('hashchange', () => { readHash(); render(); });
    render();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
